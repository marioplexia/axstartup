<meta property="og:title" content="Ax AI · Reclamos de garantía correctos a la primera">
<meta property="og:description" content="Ax AI revisa y completa cada reclamo de garantía antes de que llegue a la armadora, dentro del mismo proceso que tu agencia ya usa.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D4ED8'/%3E%3Cpath d='M9 23l7-14 7 14' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='19' r='2' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#F3F3F3;--card:#fff;--ink:#111827;--mut:#6B7280;--line:#E5E7EB;--blue:#1D4ED8;--navy:#0B1F3A;--ok:#16A34A;--warn:#EA580C;--r:24px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 20px}
section{padding:96px 0}
.eyebrow{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-bottom:16px}
h1,h2,h3{letter-spacing:-.03em;line-height:1.05;font-weight:700}
h1{font-size:clamp(40px,7.2vw,84px)}
h2{font-size:clamp(32px,5vw,56px)}
h3{font-size:22px;letter-spacing:-.02em;line-height:1.2}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--mut);max-width:640px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;font-weight:600;font-size:16px;transition:transform .2s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000;box-shadow:0 10px 24px rgba(17,24,39,.2)}
.btn-light{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn-light:hover{box-shadow:inset 0 0 0 1px #cfd3da,0 8px 20px rgba(17,24,39,.06)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
/* nav */
.nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:50;width:calc(100% - 32px);max-width:880px;background:#0a0a0a;color:#fff;border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:8px 8px 8px 20px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.nav-r{display:flex;align-items:center;gap:6px}
.nav-link{padding:10px 14px;border-radius:999px;font-size:14px;font-weight:500;color:#d1d5db}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.08)}
.nav .btn{height:40px;padding:0 18px;font-size:14px}
.lang{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px}
.lang button{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;color:#9ca3af}
.lang button[aria-pressed=true]{background:#fff;color:#111}
/* hero */
.hero{padding:170px 0 40px;text-align:center}
.hero .lead{margin:24px auto 0}
.hero .btns{justify-content:center;margin-top:36px}
.rot{display:inline-grid;vertical-align:bottom;color:var(--blue)}
.rot span{grid-area:1/1;transition:opacity .45s,transform .45s;white-space:nowrap}
.rot span[aria-hidden=true]{opacity:0;transform:translateY(.4em)}
/* demo */
.demo{background:var(--card);border-radius:32px;box-shadow:0 1px 0 var(--line),0 30px 80px rgba(17,24,39,.08);overflow:hidden;display:grid;grid-template-columns:420px 1fr;min-height:560px;margin-top:56px;text-align:left}
.chat{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:22px}
.chat-h{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.dot3{display:flex;gap:6px}.dot3 i{width:10px;height:10px;border-radius:50%;background:#e5e7eb}
.msgs{flex:1;display:flex;flex-direction:column;gap:12px;padding:18px 0;overflow:hidden}
.m{max-width:88%;padding:12px 15px;border-radius:18px;font-size:14px;line-height:1.45;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.m.show{opacity:1;transform:none}
.m.u{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.m.a{align-self:flex-start;background:#F3F4F6;border-bottom-left-radius:6px}
.m.a b{display:block;font-size:12px;color:var(--blue);margin-bottom:4px}
.chk{list-style:none;margin-top:8px;display:grid;gap:5px}
.chk li{display:flex;justify-content:space-between;gap:12px;opacity:.25;transition:opacity .35s}
.chk li.on{opacity:1}
.chk .ok{color:var(--ok);font-weight:700}.chk .w{color:var(--warn);font-weight:700}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:#9ca3af;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.inp{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:12px 14px 12px 18px;color:#9ca3af;font-size:14px}
.inp span{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px}
.canvas{position:relative;padding:36px;background-color:#FAFAFA;background-image:linear-gradient(#ececec 1px,transparent 1px),linear-gradient(90deg,#ececec 1px,transparent 1px);background-size:28px 28px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.node{width:min(360px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:0 6px 20px rgba(17,24,39,.06);opacity:.35;transform:scale(.97);transition:opacity .45s,transform .45s,border-color .45s;position:relative}
.node.on{opacity:1;transform:none;border-color:#c7d2fe}
.node small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.node strong{font-size:15px}
.node .ic{position:absolute;right:16px;top:16px;width:26px;height:26px;border-radius:8px;background:#EEF2FF;color:var(--blue);display:grid;place-items:center;font-size:13px;font-weight:800}
.tag{display:inline-block;margin-top:10px;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;transition:background .3s,color .3s}
.tag.w{background:#FFEDD5;color:var(--warn)}.tag.ok{background:#DCFCE7;color:var(--ok)}
.link{width:2px;height:26px;background:#d1d5db;position:relative;overflow:hidden}
.link::after{content:"";position:absolute;left:0;top:-100%;width:100%;height:100%;background:var(--blue);transition:top .5s}
.link.on::after{top:0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.step{text-align:left;background:#fff;border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;color:var(--mut);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.step i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--blue)}
.step[aria-selected=true]{color:var(--ink)}
.demo-cta{justify-content:center;margin-top:28px}
/* strip */
.strip{padding:36px 0;text-align:center;color:var(--mut);font-size:15px;font-weight:500}
.strip span{margin:0 10px;color:#c4c8cf}
/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.card{background:var(--card);border-radius:var(--r);padding:32px;box-shadow:0 1px 0 var(--line)}
.big{font-size:clamp(36px,4vw,52px);font-weight:800;letter-spacing:-.04em;line-height:1;margin-bottom:16px}
.card p{color:var(--mut)}
.note{margin-top:16px;font-size:13px;color:#9ca3af}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:48px}
.card .btn{margin-top:28px}
.card .k{font-size:13px;font-weight:700;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
/* dark */
.dark{background:radial-gradient(80% 90% at 50% 40%,#16365f 0%,var(--navy) 60%,#071426 100%);color:#fff;border-radius:40px;margin:0 16px;padding:140px 20px;position:relative;overflow:hidden;text-align:center}
.dark h2{position:relative;z-index:2}
.dark .btn{margin-top:32px;position:relative;z-index:2;background:#fff;color:var(--ink)}
.bub{position:absolute;z-index:1;width:min(320px,80vw);text-align:left;background:rgba(255,255,255,.96);color:var(--ink);border-radius:18px;padding:14px 16px;box-shadow:0 20px 50px rgba(0,0,0,.35);font-size:14px;animation:fl 7s ease-in-out infinite}
.bub b{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);font-weight:600;margin-bottom:6px}
.bub b::before{content:"";width:18px;height:18px;border-radius:6px;background:var(--blue)}
.b1{left:6%;top:14%}.b2{right:5%;top:30%;animation-delay:-2.3s}.b3{left:12%;bottom:10%;animation-delay:-4.6s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
/* how */
.num{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:28px;display:block}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px}
.grid4 .card{padding:28px;min-height:260px;display:flex;flex-direction:column}
.grid4 h3{margin-bottom:10px}
.split{display:grid;grid-template-columns:1fr 1.2fr;gap:48px;align-items:start}.split>*,.uc>*,form>*,.grid2>*,.grid3>*,.grid4>*{min-width:0}
/* use cases */
.uc{display:grid;grid-template-columns:320px 1fr;gap:16px;margin-top:48px}
.tabs{display:flex;flex-direction:column;gap:6px}
.tab{text-align:left;padding:16px 18px;border-radius:16px;font-weight:600;color:var(--mut);transition:background .2s,color .2s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:#fff;color:var(--ink);box-shadow:0 1px 0 var(--line)}
.panel{background:#fff;border-radius:28px;padding:40px;min-height:420px;display:flex;flex-direction:column}
.panel .k{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:20px}
.panel p{color:var(--mut);font-size:18px;margin-top:12px;max-width:520px}
.flow{margin-top:auto;padding-top:40px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background-image:radial-gradient(#e5e7eb 1px,transparent 1px);background-size:16px 16px;border-radius:20px;padding:28px}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;box-shadow:0 4px 12px rgba(17,24,39,.05);opacity:0;transform:translateY(6px);animation:ci .5s forwards}
.chip:last-child{background:var(--ink);color:#fff;border-color:var(--ink)}
.arr{color:#9ca3af;opacity:0;animation:ci .5s forwards}
@keyframes ci{to{opacity:1;transform:none}}
/* form */
.founder{background:#fff;border-radius:28px;padding:40px}
.founder p{color:var(--mut);font-size:18px;margin-top:18px}
.sig{margin-top:28px;display:flex;align-items:center;gap:14px;font-weight:600}
.sig i{width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
form{background:#fff;border-radius:28px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
form h3{grid-column:1/-1;margin-bottom:6px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#374151}
input,select,textarea{font:inherit;font-size:15px;font-weight:400;color:var(--ink);background:#F9FAFB;border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
textarea{min-height:96px;resize:vertical}
.full{grid-column:1/-1}
.marcas{display:flex;flex-wrap:wrap;gap:8px}
.marcas label{flex-direction:row;align-items:center;gap:8px;background:#F9FAFB;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:500;cursor:pointer}
.marcas input{width:auto}
.priv{flex-direction:row;align-items:center;gap:10px;font-weight:500}
.priv input{width:18px;height:18px}
.priv a{text-decoration:underline}
form .btn{grid-column:1/-1}
.thanks{grid-column:1/-1;text-align:center;padding:40px 0;font-size:20px;font-weight:600}
/* faq */
.faq{max-width:820px;margin:48px auto 0}
.q{background:#fff;border-radius:20px;margin-bottom:10px;overflow:hidden}
.q button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;text-align:left;padding:22px 24px;font-size:17px;font-weight:600}
.q button span{flex:none;width:28px;height:28px;border-radius:50%;background:#F3F4F6;display:grid;place-items:center;transition:transform .3s}
.q button[aria-expanded=true] span{transform:rotate(45deg)}
.q .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.q .a>div{overflow:hidden;color:var(--mut);padding:0 24px}
.q button[aria-expanded=true]+.a{grid-template-rows:1fr}
.q button[aria-expanded=true]+.a>div{padding-bottom:22px}
/* final + footer */
.final{text-align:center}
.final .btns{justify-content:center;margin-top:32px}
footer{padding:64px 0 40px;border-top:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:1.6fr repeat(4,1fr);gap:24px}
.fgrid h4{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:14px}
.fgrid a{display:block;font-size:14px;margin-bottom:10px}
.fgrid a:hover{color:var(--blue)}
.copy{margin-top:48px;color:#9ca3af;font-size:13px}
/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
@media (max-width:960px){
 .demo{grid-template-columns:1fr}.chat{border-right:0;border-bottom:1px solid var(--line);min-height:430px}
 .grid3,.grid2,.grid4,.split,.uc{grid-template-columns:1fr}
 .tabs{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}
 .tab{flex:none;scroll-snap-align:start;white-space:nowrap}
 .fgrid{grid-template-columns:1fr 1fr}
 .bub{position:relative;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;margin:16px auto 0;display:block}
 .dark{padding:90px 20px}
}
@media (max-width:640px){
 section{padding:72px 0}
 .nav-link,.nav .btn{display:none}
 .steps{grid-template-columns:1fr 1fr}
 .rot span{white-space:normal}
 h1{font-size:40px}
 form{grid-template-columns:1fr;padding:24px}
 .panel,.founder{padding:28px}
 .canvas{padding:24px 16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<nav class="nav" aria-label="Principal">
 <a href="#" class="logo" aria-label="Ax AI, inicio"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1D4ED8"/><path d="M9 23l7-14 7 14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="19" r="2" fill="#fff"/></svg>Ax AI</a>

<main>
<!-- 2 hero + 3 demo -->
<section class="hero"><div class="wrap">
 <span class="eyebrow rv" data-i="hero.eyebrow"></span>
 <h1 class="rv"><span data-i="hero.t1"></span><br><span class="rot" id="rot" aria-live="polite"></span></h1>

 <div class="btns rv"><a class="btn btn-dark" href="#piloto" data-i="cta.pilot"></a><a class="btn btn-light" href="#piloto" data-i="cta.team"></a></div>

 <div class="demo rv" id="demo" aria-label="Demostración">
  <div class="chat">
   <div class="chat-h"><div class="dot3"><i></i><i></i><i></i></div><span data-i="demo.head"></span></div>
   <div class="msgs" id="msgs"></div>
   <div class="inp"><span style="margin:0;width:auto;height:auto;background:none;color:inherit" data-i="demo.input"></span><span aria-hidden="true">↑</span></div>
  </div>

 </div>
 <div class="steps" role="tablist" id="steps"></div>

</div></section>

<!-- 4 strip -->
<div class="strip"><div class="wrap" id="strip"></div></div>

<!-- 5 problem -->
<section><div class="wrap">
 <h2 class="rv" data-i="prob.title"></h2>
 <div class="grid3" id="prob"></div>
 <p class="note" data-i="prob.src"></p>
</div></section>

<!-- 6 two sides -->
<section style="padding-top:0"><div class="wrap">
 <h2 class="rv" data-i="sides.title"></h2>
 <div class="grid2">
  <div class="card rv"><div class="k" data-i="sides.a.k"></div><h3 data-i="sides.a.t"></h3><p style="margin-top:12px" data-i="sides.a.p"></p><a class="btn btn-dark" href="#piloto" data-i="cta.pilot"></a></div>
  <div class="card rv"><div class="k" data-i="sides.b.k"></div><h3 data-i="sides.b.t"></h3><p style="margin-top:12px" data-i="sides.b.p"></p><a class="btn btn-light" href="#piloto" data-i="cta.team"></a></div>
 </div>
</div></section>

<!-- 7 dark -->
<div class="dark rv">
 <div class="bub b1"><b data-i="bub.h"></b><span data-i="bub.1"></span></div>
 <div class="bub b2"><b data-i="bub.h"></b><span data-i="bub.2"></span></div>
 <h2 data-i="dark.title"></h2>
 <a class="btn" href="#piloto" data-i="cta.pilot"></a>
 <div class="bub b3"><b data-i="bub.h"></b><span data-i="bub.3"></span></div>
</div>

<!-- 8 how -->
<section id="como-funciona"><div class="wrap">
 <span class="eyebrow" data-i="how.k"></span>
 <h2 class="rv" data-i="how.title"></h2>
 <div class="grid4" id="how"></div>
</div></section>

<!-- 9 pilot -->
<section style="padding-top:0"><div class="wrap split">
 <div class="rv"><span class="eyebrow" data-i="pil.k"></span><h2 data-i="pil.title"></h2><p class="lead" style="margin-top:20px" data-i="pil.p"></p></div>
 <div style="display:grid;gap:16px" id="pil"></div>
</div></section>

<!-- 10 use cases -->
<section style="padding-top:0"><div class="wrap">
 <span class="eyebrow" data-i="uc.k"></span>
 <h2 class="rv" data-i="uc.title"></h2>
 <div class="uc"><div class="tabs" role="tablist" id="uctabs"></div><div class="panel" role="tabpanel" id="ucpanel"></div></div>
</div></section>

<!-- 11 founder + form -->
<section id="piloto"><div class="wrap split" style="grid-template-columns:1fr 1.15fr">
 <div class="founder rv" id="sobre-nosotros"><span class="eyebrow" data-i="fd.k"></span><h2 style="font-size:clamp(28px,3.4vw,40px)" data-i="fd.title"></h2><p data-i="fd.p"></p><div class="sig"><i>MA</i><span data-i="fd.sig"></span></div></div>
 <form id="form" class="rv" novalidate>
  <h3 data-i="form.title"></h3>
  <label><span data-i="form.name"></span><input name="nombre" required autocomplete="name"></label>
  <label><span data-i="form.group"></span><input name="grupo" required autocomplete="organization"></label>
  <label><span data-i="form.role"></span><input name="puesto" autocomplete="organization-title"></label>
  <label><span data-i="form.n"></span><input name="agencias" type="number" min="1" inputmode="numeric"></label>

document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){lang=b.dataset.lang;try{localStorage.setItem('axai-lang',lang)}catch(e){}applyLang()}});

/* aparición al hacer scroll */
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12}):null;
document.querySelectorAll('.rv').forEach(function(e){if(io&&!RM)io.observe(e);else e.classList.add('in')});

/* LinkedIn configurable */
(function(){var l=document.getElementById('linkedin');if(CONFIG.linkedin&&CONFIG.linkedin.indexOf('__')!==0)l.href=CONFIG.linkedin;else l.parentNode.style.display='none'})();

/* formulario */
document.getElementById('form').addEventListener('submit',function(e){
 e.preventDefault();var f=e.target,err=document.getElementById('ferr');
 var ok=f.nombre.value.trim()&&f.grupo.value.trim()&&/^\S+@\S+\.\S+$/.test(f.correo.value)&&f.privacidad.checked;
 if(!ok){err.textContent=t('form.err');err.style.display='block';return}
 err.style.display='none';
 var data={nombre:f.nombre.value,grupo:f.grupo.value,puesto:f.puesto.value,agencias:f.agencias.value,marcas:[].map.call(f.querySelectorAll('[name=marcas]:checked'),function(x){return x.value}),correo:f.correo.value,whatsapp:f.whatsapp.value,mensaje:f.mensaje.value,idioma:lang};
 function thanks(){f.innerHTML='<p class="thanks">'+esc(t('form.thanks'))+'</p>'}
 if(CONFIG.formEndpoint&&CONFIG.formEndpoint.indexOf('__')!==0){
  fetch(CONFIG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)}).then(function(r){if(!r.ok)throw 0;thanks()}).catch(function(){err.textContent=lang==='es'?'No se pudo enviar. Escríbenos a '+CONFIG.contacto:'Could not send. Email us at '+CONFIG.contacto;err.style.display='block'});
 }else{
  /* sin servicio configurado: abre el correo con la solicitud ya escrita */
  var body=Object.keys(data).map(function(k){return k+': '+(Array.isArray(data[k])?data[k].join(', '):data[k])}).join('\n');
  location.href='mailto:'+CONFIG.contacto+'?subject='+encodeURIComponent('Solicitud de piloto · '+data.grupo)+'&body='+encodeURIComponent(body);thanks();
 }
});
applyLang();
</script>
