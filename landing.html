<style>
:root{--bg:#F1F1F1;--ink:#0A0A0A;--mut:#6F6F73;--soft:#9A9AA0;--line:#DCDCDE;--card:#fff;--blue:#1D4ED8;--sky:#4E9BD4;--ok:#16A34A;--warn:#EA580C;
 --edge:radial-gradient(130% 95% at 50% 42%,rgba(0,0,0,0) 52%,rgba(150,175,200,.42) 100%);
 --grad:var(--edge),linear-gradient(180deg,#2e2e3a 0%,#0d1021 9%,#020d24 20%,#000c2d 32%,#031745 42%,#19305d 50%,#295f8e 58%,#2c7faf 66%,#5fb2dd 76%,#a4cee4 84%,#cadbe5 90%,#e9eaeb 96%,#f1f1f1 100%);
 --gradcard:var(--edge),linear-gradient(180deg,#3a3b40 0%,#1d212b 12%,#0e1626 26%,#0b1730 40%,#13295a 54%,#1f4677 66%,#3f6d98 78%,#7c9bb7 90%,#aebdc8 100%);
 --graduc:linear-gradient(180deg,#262d50 0%,#061647 16%,#0a2453 30%,#0e3263 42%,#1b4f7a 56%,#215f83 66%,#5a8caa 80%,#93b6cd 90%,#bcd5e7 100%);
 --gradfin:var(--edge),linear-gradient(180deg,#00163f 0%,#022657 18%,#103e6c 32%,#1d577e 44%,#2d698c 54%,#6092ad 66%,#aac8db 82%,#d4e4ee 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}
.wrap{width:100%;max-width:1140px;margin:0 auto;padding:0 24px}
section{padding:110px 0}
h1,h2,h3,.disp{font-family:'Inter Tight',Inter,sans-serif;font-weight:400;letter-spacing:-.045em;line-height:1.04}
h1{font-size:clamp(42px,6.6vw,86px)}
h2{font-size:clamp(34px,4.4vw,56px)}
h3{font-size:clamp(24px,2.4vw,30px);letter-spacing:-.035em;line-height:1.12}
.eyebrow{display:block;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.sub{color:var(--mut);font-size:16px;max-width:560px}
.sub b,.lede b{color:var(--ink);font-weight:600}
.center{text-align:center}.center .sub{margin-left:auto;margin-right:auto}
/* botones */
.btn{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 22px;border-radius:999px;font-weight:500;font-size:15px;transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{box-shadow:0 10px 24px rgba(0,0,0,.18)}
.btn-light{background:#fff;color:var(--ink)}
.btn-light:hover{box-shadow:0 8px 20px rgba(0,0,0,.08)}
.btn .ar{font-size:16px;line-height:1}
.duo{display:inline-flex;align-items:center;gap:0;position:relative}
.duo .btn{border-radius:12px;height:44px;padding:0 24px;position:relative;z-index:1}
.duo .sq{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:17px;margin-left:12px;position:relative;z-index:1}
.duo::after{content:"";position:absolute;top:50%;height:22px;width:20px;transform:translateY(-50%);right:36px;border-radius:4px;z-index:0}
.duo.dark::after{background:var(--ink)}.duo.light::after{background:#fff}
.duo:hover .btn,.duo:hover .sq{transform:none}
.duo.dark .btn,.duo.dark .sq{background:var(--ink);color:#fff}
.duo.light .btn,.duo.light .sq{background:#fff;color:var(--ink)}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center .btns{justify-content:center}
/* grano */
.grain{position:relative;isolation:isolate}
.grain::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;opacity:.28;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.grain>*{position:relative;z-index:2}
/* navegación */
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;width:calc(100% - 28px);max-width:560px;height:52px;background:rgba(12,12,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 7px 0 16px;box-shadow:0 8px 30px rgba(0,0,0,.16)}
.logo{display:flex;align-items:center;gap:8px;font-family:'Inter Tight',Inter,sans-serif;font-weight:500;font-size:17px;letter-spacing:-.03em}
.nav-r{display:flex;align-items:center;gap:4px}
.nav-link{padding:8px 11px;border-radius:10px;font-size:13px;color:#c9c9cf}
.nav-link:hover{color:#fff}
.nav .btn{height:38px;padding:0 15px;font-size:13px;border-radius:11px}
.lang{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;margin-left:2px}
.lang button{padding:5px 8px;border-radius:8px;font-size:11px;font-weight:600;color:#a1a1aa}
.lang button[aria-pressed=true]{background:#fff;color:#111}
/* hero */
.hero{padding:160px 0 60px}
.hero h1{max-width:980px;margin:0 auto}
.hero .sub{margin:26px auto 0;font-size:18px;max-width:600px}
.hero .btns{margin-top:34px}
.rot{display:inline-grid;vertical-align:bottom;color:var(--blue)}
.rot span{grid-area:1/1;transition:opacity .5s,transform .5s,filter .5s;white-space:nowrap}
.rot span[aria-hidden=true]{opacity:0;transform:translateY(.35em);filter:blur(6px)}
/* demo */
.brands{display:flex;justify-content:center;margin:64px auto 0}
.brands div{display:flex;gap:2px;background:#E2E2E4;border-radius:14px;padding:4px;overflow-x:auto;max-width:100%}
.brands button{padding:7px 14px;border-radius:10px;font-size:14px;font-weight:500;color:#3f3f46;white-space:nowrap;display:flex;align-items:center;gap:7px}
.brands button i{width:16px;height:16px;border-radius:5px;display:inline-block}
.brands button[aria-pressed=true]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.demo{max-width:1000px;margin:16px auto 0;display:grid;grid-template-columns:1fr 1fr;background:#fff;border-radius:22px;box-shadow:0 0 0 1px #e4e4e7,0 30px 60px rgba(0,0,0,.06);overflow:hidden;text-align:left;min-height:520px}
.chat{background:#F5F3EF;display:flex;flex-direction:column;border-right:1px solid #e7e5e0}
.chat-h,.canv-h{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #e7e5e0;font-size:14px;font-weight:500}
.chat-h .who{display:flex;align-items:center;gap:8px}.chat-h .sep{width:1px;height:16px;background:#d6d3cd}.chat-h .muted{color:var(--mut);font-weight:400}
.chat-h .con{margin-left:auto;font-size:12px;color:var(--mut);background:#fff;border-radius:999px;padding:4px 10px;display:flex;align-items:center;gap:6px}
.chat-h .con::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e}
.msgs{flex:1;display:flex;flex-direction:column;gap:14px;padding:20px 18px;overflow:hidden}
.m{opacity:0;transform:translateY(8px);transition:opacity .45s,transform .45s;font-size:14.5px;line-height:1.5}
.m.show{opacity:1;transform:none}
.m.u{align-self:flex-end;max-width:85%;background:#E9E5DD;border-radius:14px;padding:12px 15px}
.m.a{display:flex;gap:10px;max-width:96%}
.m.a .av{flex:none;width:22px;height:22px;border-radius:7px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:1px}
.chk{list-style:none;margin-top:8px;display:grid;gap:6px;font-size:13.5px}
.chk li{display:flex;gap:8px;color:var(--mut);opacity:.25;transition:opacity .35s}
.chk li.on{opacity:1}
.chk li b{color:var(--ink);font-weight:500}
.chk .ok{color:#16a34a}.chk .w{color:var(--warn)}
.typing{display:inline-flex;gap:4px;padding-top:6px}.typing i{width:6px;height:6px;border-radius:50%;background:#a8a29e;animation:bl 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.3}40%{opacity:1}}
.inp{margin:0 14px 14px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #e7e5e0;border-radius:14px;padding:9px 9px 9px 12px;color:#a8a29e;font-size:14px}
.inp .pl{width:26px;height:26px;border-radius:8px;border:1px solid #e7e5e0;display:grid;place-items:center;color:#78716c}
.inp .go{margin-left:auto;width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;display:grid;place-items:center;opacity:.6}
.canvas-w{display:flex;flex-direction:column}
.canv-h{border-bottom:1px solid #eee}
.canv-h small{display:block;font-size:11px;color:var(--mut);font-weight:400;line-height:1}
.canvas{position:relative;flex:1;margin:0;background-color:#fafafa;background-image:linear-gradient(#ededed 1px,transparent 1px),linear-gradient(90deg,#ededed 1px,transparent 1px);background-size:22px 22px;display:flex;flex-direction:column;justify-content:center;padding:44px 28px 56px;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .4s}
.canvas.live{outline-color:var(--blue)}
.banner{position:absolute;top:0;left:50%;transform:translate(-50%,-2px);background:var(--blue);color:#fff;font-size:12.5px;font-weight:500;border-radius:0 0 10px 10px;padding:6px 12px;white-space:nowrap;opacity:0;transition:opacity .4s}
.canvas.live .banner{opacity:1}
.node{display:flex;align-items:center;gap:12px;opacity:.3;transition:opacity .45s,transform .45s;transform:translateX(-4px)}
.node.on{opacity:1;transform:none}
.node .ic{flex:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid #e4e4e7;display:grid;place-items:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.node .ic.blue{background:#0f1f43;color:#fff;border-color:#0f1f43}
.node strong{display:block;font-weight:600;font-size:14.5px}
.node small{color:var(--mut);font-size:13px}
.tag{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;vertical-align:1px}
.tag.w{background:#FFEDD5;color:var(--warn)}.tag.ok{background:#DCFCE7;color:var(--ok)}
.vline{width:1px;height:20px;background:#d4d4d8;margin-left:19px}
.ctrls{position:absolute;left:12px;bottom:12px;display:flex;gap:2px;background:#fff;border:1px solid #e4e4e7;border-radius:9px;padding:3px}
.ctrls span{width:24px;height:24px;display:grid;place-items:center;font-size:13px;color:#52525b}
.hint{position:absolute;right:12px;bottom:12px;background:#fff;border:1px solid #e4e4e7;border-radius:9px;padding:5px 10px;font-size:12px;color:#52525b}
.steps{max-width:780px;margin:26px auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{text-align:left;padding-top:12px;font-size:14px;color:var(--soft);position:relative}
.step::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:#d9d9dc;border-radius:2px}
.step i{position:absolute;left:0;top:0;height:2px;width:0;background:var(--ink);border-radius:2px;z-index:1}
.step[aria-selected=true]{color:var(--ink)}
.step em{font-style:normal;color:var(--soft);margin-right:6px}
.demo-cta{margin-top:34px}
/* franja */
.strip{padding:30px 0 0}
.strip .wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;justify-content:center;font-size:14px;color:#7a7a80}
.strip b{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8a8a90;font-weight:500}
.strip span{display:flex;align-items:center;gap:8px}
.strip span::before{content:"";width:6px;height:6px;border-radius:50%;background:#b8b8bd}
/* dos formas / problema */
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:940px;margin:56px auto 0;text-align:left}
.two>div{border-top:1px solid var(--line);padding-top:26px}
.two h3{margin-bottom:12px}
.two p{color:var(--mut);font-size:15px;max-width:400px}
.two .btns{margin-top:22px}
.two .btn{height:38px;padding:0 16px;font-size:13.5px}
.probs{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:56px}
.probs>div{border-top:1px solid var(--line);padding-top:24px}
.probs .disp{font-size:clamp(34px,3.6vw,48px);margin-bottom:12px}
.probs p{color:var(--mut)}
.note{margin-top:22px;font-size:12.5px;color:#9a9aa0}
/* la diferencia */
.diff{margin:0 14px;border-radius:56px;min-height:680px;display:grid;place-items:center;text-align:center;color:#fff;background:radial-gradient(60% 55% at 50% 48%,rgba(40,90,160,.55) 0%,rgba(0,0,0,0) 70%),var(--edge),linear-gradient(180deg,#26272c 0%,#0b0f1c 22%,#030a1d 50%,#0a1d42 78%,#24466f 100%);overflow:hidden;padding:120px 24px}
.diff h2{font-size:clamp(40px,5.4vw,72px)}
.diff .duo{margin-top:30px}
.bub{position:absolute;width:min(330px,82vw);text-align:left;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.45;animation:fl 8s ease-in-out infinite;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.bub b{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#c7d2fe;font-weight:500;margin-bottom:6px}
.bub b::before{content:"";width:16px;height:16px;border-radius:5px;background:var(--blue)}
.b1{left:5%;top:14%}.b2{right:4%;top:36%;animation-delay:-2.6s}.b3{left:9%;bottom:12%;animation-delay:-5.2s}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
/* cómo funciona (pegajoso) */
.how-head{text-align:center;margin-bottom:40px}
.how{display:grid;grid-template-columns:1fr 1.05fr;gap:64px}
.how-steps>div{min-height:72vh;display:flex;flex-direction:column;justify-content:center;opacity:.28;transition:opacity .5s}
.how-steps>div.act{opacity:1}
.how-steps .n{font-size:13px;color:var(--mut);margin-bottom:14px}
.how-steps h3{font-size:clamp(28px,3vw,38px);margin-bottom:18px}
.how-steps p{max-width:340px;color:var(--mut)}
.how-steps p b{color:var(--ink);font-weight:600}
.stage{position:sticky;top:12vh;height:76vh;max-height:620px;border-radius:26px;background:var(--gradcard);overflow:hidden;color:#fff}
.scene{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 9%;opacity:0;transition:opacity .5s;pointer-events:none}
.scene.on{opacity:1;pointer-events:auto}
.scene .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#a9b4c8;margin-bottom:12px}
.src{list-style:none;display:grid;gap:9px;max-width:330px}
.src li{height:38px;border-radius:11px 4px 4px 11px;background:#000;position:relative;display:flex;align-items:center;font-size:14.5px;margin-right:46px}
.src li::before{content:"";position:absolute;inset:0;width:var(--p,0%);border-radius:inherit;background:#4a96cf;transition:width 1.1s cubic-bezier(.4,0,.2,1)}
.src li::after{content:"";position:absolute;right:-46px;top:3px;width:32px;height:32px;border-radius:10px;background:#000;box-shadow:-10px 0 0 -6px #000}
.src li .cap{position:absolute;right:-38px;top:11px;width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.85);border-top-color:transparent;z-index:2;animation:spin 1s linear infinite}
.src li.done .cap{animation:none;border:0;width:auto;height:auto;top:9px;right:-34px;font-size:13px}
.src li.done .cap::before{content:"✓"}
@keyframes spin{to{transform:rotate(360deg)}}
.src li span{position:relative;padding:0 14px;display:flex;align-items:center;gap:10px}
.src li span i{width:16px;height:16px;border-radius:5px;background:rgba(255,255,255,.85);display:inline-block}
.src li em{display:none}
.src li.done em{opacity:1}
.appr{max-width:360px;background:#0a0a0c;border-radius:16px;padding:18px;font-size:14px}
.appr .ln{height:6px;border-radius:4px;background:#26262b;margin-top:9px}
.appr .row{display:flex;gap:8px;margin-top:16px}
.appr .row span{font-size:11.5px;background:#1d1d22;border-radius:999px;padding:4px 10px;color:#c4c4cc}
.appr-f{max-width:360px;display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:12.5px;color:#c7d2e3}
.appr-f .ok{display:flex;align-items:center;gap:8px}
.appr-f .ok::before{content:"✓";width:16px;height:16px;border-radius:50%;background:#4f97cf;color:#fff;font-size:10px;display:grid;place-items:center}
.flowv{display:grid;gap:10px;max-width:340px}
.flowv div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 14px;display:flex;justify-content:space-between;font-size:14px;opacity:.35;transition:opacity .4s,background .4s}
.flowv div.on{opacity:1;background:rgba(79,151,207,.35)}
/* piloto (garantía) */
.guar{margin:0 14px;border-radius:80px 80px 80px 80px;background:var(--grad);color:#fff;padding:130px 24px 170px;overflow:hidden}
.guar h2{font-size:clamp(38px,4.8vw,62px)}
.guar .sub{color:#aab6cc}
.glass3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:1040px;margin:70px auto 0}
.glass{border-radius:36px;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);min-height:330px;padding:24px 26px 28px;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -20px 40px rgba(255,255,255,.04);text-align:left}
.gv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.gbox{width:96px;height:88px;border-radius:22px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center}
.gchip{font-size:11px;color:#e6eef7;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);border-radius:999px;padding:3px 10px}
.gcon{display:flex;gap:12px;align-items:center;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);border-radius:999px;padding:10px 14px}
.gcon i{width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#0b1730;font-style:normal;font-weight:700;font-size:12px}
.gnote{width:88%;display:flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);border-radius:14px;padding:9px 12px;font-size:12px;color:#fff}
.gnote i{width:22px;height:22px;border-radius:6px;background:#fff;color:#0b1730;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.gcard{width:62%;height:64px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.06)}
.glass .no{font-size:13px;color:#d6e2f2}
.glass .vis{flex:1;display:grid;place-items:center}

.glass-d p{font-size:14.5px;color:#c8d6e8;padding:0 6px}
.glass-d b{color:#fff;font-weight:600}
.guar .btns{margin-top:44px}

.uc-l{background:var(--graduc);border-radius:0 28px 28px 0;display:flex;align-items:center;padding:60px 0 60px max(24px,calc((100vw - 1140px)/2 + 24px));overflow:hidden}
.pills{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.pill{border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:999px;padding:12px 24px;font-family:'Inter Tight',Inter,sans-serif;font-size:clamp(17px,1.7vw,22px);letter-spacing:-.02em;transition:background .3s,color .3s,border-color .3s;text-align:left}

.ucard.front{z-index:1;animation:uin .6s cubic-bezier(.2,.7,.2,1)}

.ucard .fl svg{position:absolute;inset:0;width:100%;height:100%}
.ucard .nd{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:10.5px;color:#a9afc0;width:92px}
.ucard .nd i{display:grid;place-items:center;margin:0 auto 5px;width:30px;height:30px;border-radius:9px;background:#fff;color:#0b0e1a;font-style:normal;font-weight:700;font-size:12px}
.ucard .nd.last i{background:var(--blue);color:#fff}
.ucard p{font-size:14px;color:#b9bfd0}
.ucard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.ucard .chipk{background:#fff;color:#0b0e1a;border-radius:999px;font-size:11.5px;font-weight:600;padding:4px 10px;text-transform:uppercase}
.ucard .plus{width:28px;height:28px;border-radius:50%;border:1px solid #3a3f50;display:grid;place-items:center}
/* fundador + formulario */
.fnd{display:grid;grid-template-columns:.95fr 1.05fr;gap:20px;align-items:stretch}
.story{border-radius:28px;background:#0b0e1a;color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between;min-height:520px}
.story h2{font-size:clamp(30px,3vw,40px)}
.story p{color:#b9bfd0;font-size:16.5px;margin-top:22px;line-height:1.6}
.sig{display:flex;align-items:center;gap:12px;margin-top:30px;font-size:14px}
.sig i{width:42px;height:42px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-style:normal;font-weight:600}
form{background:#fff;border-radius:28px;padding:34px;display:grid;grid-template-columns:1fr 1fr;gap:14px;align-content:start}
form h3{grid-column:1/-1;margin-bottom:4px}
label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:500;color:#3f3f46}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:#F4F4F5;border:1px solid transparent;border-radius:12px;padding:11px 13px;width:100%;transition:border-color .2s,background .2s}
input:focus,textarea:focus{background:#fff;border-color:#d4d4d8;outline:none}
textarea{min-height:90px;resize:vertical}
.full{grid-column:1/-1}
.marcas{display:flex;flex-wrap:wrap;gap:8px}
.marcas label{flex-direction:row;align-items:center;gap:8px;background:#F4F4F5;border-radius:999px;padding:8px 13px;font-weight:400;cursor:pointer;font-size:13.5px}
.marcas input{width:auto}
.priv{flex-direction:row;align-items:center;gap:10px;font-weight:400;font-size:13.5px}
.priv input{width:17px;height:17px}
.priv a{text-decoration:underline}
form .btn{grid-column:1/-1;justify-content:center;height:48px}
.thanks{grid-column:1/-1;text-align:center;padding:60px 0;font-family:'Inter Tight',Inter,sans-serif;font-size:26px;letter-spacing:-.03em}
/* faq */
.faqw{display:grid;grid-template-columns:.8fr 2fr;gap:40px}
.faqw h2{font-size:clamp(40px,4.4vw,58px)}
.q{border-bottom:1px solid var(--line)}
.q:first-child{border-top:1px solid var(--line)}

.q button span{flex:none;font-size:20px;font-weight:300;transition:transform .3s}
.q button[aria-expanded=true] span{transform:rotate(45deg)}
.q .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s}
.q .a>div{overflow:hidden;color:var(--mut);font-size:15px;max-width:620px}
.q button[aria-expanded=true]+.a{grid-template-rows:1fr}
.q button[aria-expanded=true]+.a>div{padding-bottom:20px}
/* final */
.final{margin:0 auto;max-width:1180px;border-radius:72px;background:var(--gradfin);color:#fff;text-align:center;padding:150px 24px 190px;position:relative;overflow:hidden}
.final h2{font-size:clamp(36px,4.6vw,58px)}
.final .sub{color:#9fb6cf;margin:16px auto 0;font-size:14px}
.final .tiny{display:block;font-size:12px;color:#c6d6e6;margin-top:8px}
.final .btns{margin-top:34px;justify-content:center;align-items:flex-start}
/* footer */
footer{padding:80px 0 34px}
.fgrid{display:grid;grid-template-columns:1.7fr repeat(4,auto);gap:44px}
.fgrid .bl{font-family:'Inter Tight',Inter,sans-serif;font-size:19px;letter-spacing:-.02em;color:#8f8f95;max-width:300px;line-height:1.3}
.fgrid .bl b{color:var(--ink);font-weight:500}
.fgrid h4{font-size:13px;font-weight:600;margin-bottom:12px}
.fgrid a{display:block;font-size:13.5px;color:#55555b;margin-bottom:8px}
.fgrid a:hover{color:var(--ink)}
.mark{display:flex;align-items:center;gap:18px;margin-top:80px;font-family:'Inter Tight',Inter,sans-serif;font-size:clamp(64px,10vw,140px);letter-spacing:-.06em;line-height:1}
.mark svg{width:.8em;height:.8em}
.copy{margin-top:16px;color:#a1a1aa;font-size:12.5px}
/* aparición */
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}

function drawUC(){var u=t('uc');
 $('ucpills').innerHTML=u.map(function(x,i){return '<button class="pill" role="tab" id="ucp'+i+'" aria-selected="'+(i===ucI)+'" tabindex="'+(i===ucI?0:-1)+'">'+esc(x[0])+'</button>'}).join('');
 document.querySelectorAll('.pill').forEach(function(b,i){b.onclick=function(){ucI=i;drawUC();restartUC()};b.onkeydown=function(e){var d=e.key==='ArrowDown'||e.key==='ArrowRight'?1:e.key==='ArrowUp'||e.key==='ArrowLeft'?-1:0;if(d){e.preventDefault();ucI=(ucI+d+u.length)%u.length;drawUC();restartUC();$('ucp'+ucI).focus()}}});
 var x=u[ucI],nx=u[(ucI+1)%u.length];
 $('stack').setAttribute('aria-labelledby','ucp'+ucI);
 $('stack').innerHTML='<div class="ucard back"><div class="k" style="color:#9a9aa0">0'+((ucI+1)%u.length+1)+' / 0'+u.length+'</div><h3>'+esc(nx[0])+'</h3></div><div class="ucard front"><div class="k">· 0'+(ucI+1)+' / 0'+u.length+' · '+esc(t('uc.lbl'))+'</div><h3>'+esc(x[0])+'</h3><div class="fl">'+nodesSVG(x[2])+'</div><p>'+esc(x[1])+'</p><div class="ft"><span class="chipk">'+esc(x[3])+'</span><span class="plus">+</span></div></div>';
}
function restartUC(){clearInterval(ucTimer);if(RM)return;ucTimer=setInterval(function(){ucI=(ucI+1)%t('uc').length;drawUC()},5200)}

/* faq */
function drawFAQ(){$('faq').innerHTML=t('faq').map(function(q,i){return '<div class="q"><button aria-expanded="'+(i===0)+'" aria-controls="fa'+i+'" id="fq'+i+'">'+esc(q[0])+'<span aria-hidden="true">+</span></button><div class="a" id="fa'+i+'" role="region" aria-labelledby="fq'+i+'"><div>'+esc(q[1])+'</div></div></div>'}).join('');
 document.querySelectorAll('.q button').forEach(function(b){b.onclick=function(){b.setAttribute('aria-expanded',b.getAttribute('aria-expanded')!=='true')}})}

function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i]').forEach(function(e){var v=t(e.dataset.i);if(typeof v==='string')e.textContent=v});
 document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.lang===lang)});
 rotI=0;drawRot();startRot();drawDemo();goStep(0,false);drawStatic();drawHow();drawUC();restartUC();drawFAQ();
}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){lang=b.dataset.lang;try{localStorage.setItem('axai-lang',lang)}catch(e){}applyLang()}});

/* aparición */
var io=('IntersectionObserver' in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12}):null;
document.querySelectorAll('.rv').forEach(function(e){if(io&&!RM)io.observe(e);else e.classList.add('in')});

/* LinkedIn configurable */
(function(){var l=$('linkedin');if(CONFIG.linkedin&&CONFIG.linkedin.indexOf('__')!==0)l.href=CONFIG.linkedin;else $('comm').style.display='none'})();

/* formulario */
$('form').addEventListener('submit',function(e){
 e.preventDefault();var f=e.target,err=$('ferr');
 var ok=f.nombre.value.trim()&&f.grupo.value.trim()&&/^\S+@\S+\.\S+$/.test(f.correo.value)&&f.privacidad.checked;
 if(!ok){err.textContent=t('form.err');err.style.display='block';return}
 err.style.display='none';
 var data={nombre:f.nombre.value,grupo:f.grupo.value,puesto:f.puesto.value,agencias:f.agencias.value,marcas:[].map.call(f.querySelectorAll('[name=marcas]:checked'),function(x){return x.value}),correo:f.correo.value,whatsapp:f.whatsapp.value,mensaje:f.mensaje.value,idioma:lang};
 function thanks(){f.innerHTML='<p class="thanks">'+esc(t('form.thanks'))+'</p>'}
 if(CONFIG.formEndpoint&&CONFIG.formEndpoint.indexOf('__')!==0){
  fetch(CONFIG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(data)}).then(function(r){if(!r.ok)throw 0;thanks()}).catch(function(){err.textContent=(lang==='es'?'No se pudo enviar. Escríbenos a ':'Could not send. Email us at ')+CONFIG.contacto;err.style.display='block'});
 }else{
  var body=Object.keys(data).map(function(k){return k+': '+(Array.isArray(data[k])?data[k].join(', '):data[k])}).join('\n');
  location.href='mailto:'+CONFIG.contacto+'?subject='+encodeURIComponent('Solicitud de piloto · '+data.grupo)+'&body='+encodeURIComponent(body);thanks();
 }
});
applyLang();
</script>
</body>
</html>
