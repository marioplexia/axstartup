/* figuras pixeladas (autos) grandes que avanzan despacio en el fondo del hero */
(function(){var c=$('pix');if(!c)return;var x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1),W,H;
 function shape(kind,w){var o=document.createElement('canvas'),hh=Math.round(w*.42);o.width=w;o.height=hh;var g=o.getContext('2d');g.fillStyle='#000';g.beginPath();
  if(kind===0){g.moveTo(w*.02,hh*.72);g.lineTo(w*.04,hh*.5);g.quadraticCurveTo(w*.2,hh*.42,w*.3,hh*.4);g.quadraticCurveTo(w*.42,hh*.06,w*.58,hh*.08);g.quadraticCurveTo(w*.72,hh*.1,w*.8,hh*.4);g.quadraticCurveTo(w*.96,hh*.44,w*.98,hh*.6);g.lineTo(w*.98,hh*.76);g.closePath()}
  else{g.moveTo(w*.02,hh*.76);g.lineTo(w*.02,hh*.38);g.lineTo(w*.12,hh*.36);g.lineTo(w*.22,hh*.06);g.lineTo(w*.56,hh*.06);g.lineTo(w*.62,hh*.36);g.lineTo(w*.98,hh*.38);g.lineTo(w*.98,hh*.76);g.closePath()}
  g.fill();g.globalCompositeOperation='destination-out';[.24,.76].forEach(function(p){g.beginPath();g.arc(w*p,hh*.78,hh*.2,0,7);g.fill()});g.globalCompositeOperation='source-over';[.24,.76].forEach(function(p){g.beginPath();g.arc(w*p,hh*.78,hh*.13,0,7);g.fill()});
  if(kind===0){g.globalCompositeOperation='destination-out';g.beginPath();g.moveTo(w*.36,hh*.38);g.quadraticCurveTo(w*.45,hh*.14,w*.56,hh*.15);g.lineTo(w*.57,hh*.38);g.closePath();g.fill();g.beginPath();g.moveTo(w*.6,hh*.38);g.lineTo(w*.6,hh*.16);g.quadraticCurveTo(w*.7,hh*.18,w*.75,hh*.38);g.closePath();g.fill()}
  var d=g.getImageData(0,0,w,hh).data,pts=[],S=7;
  for(var yy=0;yy<hh;yy+=S)for(var xx=0;xx<w;xx+=S){if(d[((yy|0)*w+(xx|0))*4+3]>128)pts.push([xx,yy,Math.random()])}return pts}
 var F=[];function size(){var r=c.getBoundingClientRect();W=r.width;H=r.height;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
 size();addEventListener('resize',size);
 var L=[[.03,.42,240,0,-.18,1],[.78,.08,300,1,.35,-1],[.62,.62,260,0,-.12,1],[.2,.78,220,1,.08,1],[.86,.48,230,0,-.4,-1],[.38,.04,200,1,.1,1],[.04,.08,180,0,.25,1]];
 L.forEach(function(l){F.push({x:l[0],y:l[1],pts:shape(l[3],l[2]),w:l[2],rot:l[4],d:l[5],v:.004+Math.random()*.004})});
 var last=performance.now();
 function draw(now){var dt=Math.min(.05,(now-last)/1000);last=now;x.clearRect(0,0,W,H);
  F.forEach(function(f){if(!RM)f.x+=f.v*dt*f.d;if(f.x>1.15)f.x=-.25;if(f.x<-.25)f.x=1.15;
   x.save();x.translate(f.x*W+f.w/2,f.y*H);x.rotate(f.rot);if(f.d<0)x.scale(-1,1);
   f.pts.forEach(function(p){var tw=.55+.45*Math.sin(now/900+p[2]*12);x.fillStyle='rgba(255,255,255,'+(.35+.65*p[2]*tw).toFixed(3)+')';x.fillRect(p[0]-f.w/2,p[1],5,5)});
   x.restore()});
  requestAnimationFrame(draw)}
 requestAnimationFrame(draw)})();
applyLang();
