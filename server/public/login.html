<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ax AI Garantías · Acceso</title>
<style>
  :root{--bg:#fafafa;--card:#fff;--ink:#0a0a14;--mute:#6b6b76;--line:#d9d9de;--seg:#f1f1f3;--btn:#171717;--btn-ink:#fff;--err:#b42318;--errbg:#fef3f2}
  @media (prefers-color-scheme:dark){:root{--bg:#0e0e11;--card:#17171b;--ink:#f4f4f6;--mute:#9b9ba6;--line:#32323a;--seg:#222228;--btn:#f4f4f6;--btn-ink:#111;--err:#fda29b;--errbg:#3a1613}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  .card{width:100%;max-width:384px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
  .logo{width:28px;height:28px;border-radius:6px;background:#000;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:24px 0;padding:4px;background:var(--seg);border-radius:10px}
  .tabs button{border:0;background:none;padding:9px;border-radius:8px;font:inherit;color:var(--mute);cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  h1{margin:0 0 6px;font-size:22px;letter-spacing:-.01em}
  .sub{margin:0 0 22px;color:var(--mute)}
  label{display:block;margin:14px 0 6px;font-size:12px;font-weight:500}
  input,select{width:100%;height:39px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
  input:focus,select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .hint{margin:4px 0 0;font-size:12px;color:var(--mute)}
  .go{width:100%;height:38px;margin-top:20px;border:0;border-radius:8px;background:var(--btn);color:var(--btn-ink);font:inherit;font-weight:500;cursor:pointer}
  .go:disabled{opacity:.6;cursor:wait}
  .err{display:none;margin-top:14px;padding:9px 12px;border-radius:8px;background:var(--errbg);color:var(--err);font-size:13px}
  .err.on{display:block}
  .alt{margin:18px 0 0;text-align:center;font-size:12px;color:var(--mute)}
  .alt a{color:inherit;text-decoration:underline;cursor:pointer}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><span class="logo">Ax</span>Ax AI Garantías</div>

  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="t-reg" aria-selected="false">Crear cuenta</button>
    <button type="button" role="tab" id="t-log" aria-selected="true">Iniciar sesión</button>
  </div>

  <form id="f-log" novalidate>
    <h1>Inicia sesión</h1>
    <p class="sub">Accede al agente de garantías de tu agencia.</p>
    <label for="l-email">Correo</label>
    <input id="l-email" type="email" autocomplete="email" required>
    <label for="l-pass">Contraseña</label>
    <input id="l-pass" type="password" autocomplete="current-password" required>
    <button class="go" type="submit">Entrar</button>
    <div class="err" role="alert"></div>
    <p class="alt">¿No tienes cuenta? <a data-go="reg">Crea una</a></p>
  </form>

  <form id="f-reg" novalidate hidden>
    <h1>Crea tu cuenta</h1>
    <p class="sub">Registra tu correo y elige tu agencia.</p>
    <label for="r-email">Correo</label>
    <input id="r-email" type="email" autocomplete="email" required>
    <label for="r-pass">Contraseña</label>
    <input id="r-pass" type="password" autocomplete="new-password" minlength="8" required>
    <p class="hint">Mínimo 8 caracteres.</p>
    <label for="r-ag">Agencia</label>
    <select id="r-ag" required><option value="">Cargando agencias…</option></select>
    <button class="go" type="submit">Crear cuenta</button>
    <div class="err" role="alert"></div>
    <p class="alt">¿Ya tienes cuenta? <a data-go="log">Inicia sesión</a></p>
  </form>
</main>

<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var forms={log:$('#f-log'),reg:$('#f-reg')},tabs={log:$('#t-log'),reg:$('#t-reg')};

  function show(w){
    for(var k in forms){forms[k].hidden=k!==w;tabs[k].setAttribute('aria-selected',k===w)}
    forms[w].querySelector('input').focus();
  }
  tabs.log.onclick=function(){show('log')};tabs.reg.onclick=function(){show('reg')};
  document.querySelectorAll('[data-go]').forEach(function(a){a.onclick=function(){show(a.dataset.go)}});

  function save(d){try{localStorage.setItem('ax.token',d.token);localStorage.setItem('ax.user',JSON.stringify(d.user))}catch(_){}location.href='/'}
  function fail(f,m){var e=f.querySelector('.err');e.textContent=m;e.classList.add('on')}

  async function send(f,url,body){
    f.querySelector('.err').classList.remove('on');
    var b=f.querySelector('.go');b.disabled=true;
    try{
      var r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      var d=await r.json().catch(function(){return{}});
      if(!r.ok)return fail(f,d.error||'No se pudo completar la solicitud.');
      save(d);
    }catch(_){fail(f,'Sin conexión con el servidor.')}
    finally{b.disabled=false}
  }

  forms.log.onsubmit=function(e){e.preventDefault();
    var em=$('#l-email').value.trim(),pw=$('#l-pass').value;
    if(!em||!pw)return fail(forms.log,'Escribe tu correo y contraseña.');
    send(forms.log,'/api/auth/login',{email:em,password:pw});
  };
  forms.reg.onsubmit=function(e){e.preventDefault();
    var em=$('#r-email').value.trim(),pw=$('#r-pass').value,ag=$('#r-ag').value;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return fail(forms.reg,'Escribe un correo válido.');
    if(pw.length<8)return fail(forms.reg,'La contraseña debe tener al menos 8 caracteres.');
    if(!ag)return fail(forms.reg,'Selecciona tu agencia.');
    send(forms.reg,'/api/auth/register',{email:em,password:pw,agency_id:Number(ag)});
  };

  // Agencias agrupadas por región
  fetch('/api/agencias').then(function(r){return r.json()}).then(function(list){
    var sel=$('#r-ag');sel.innerHTML='<option value="">Selecciona tu agencia</option>';
    var groups={};
    list.forEach(function(a){
      if(!groups[a.region]){var g=document.createElement('optgroup');g.label=a.region;sel.appendChild(g);groups[a.region]=g}
      var o=document.createElement('option');o.value=a.id;o.textContent=a.name;groups[a.region].appendChild(o);
    });
  }).catch(function(){$('#r-ag').innerHTML='<option value="">No se pudieron cargar las agencias</option>'});

  if(location.hash==='#registro')show('reg');
})();
</script>
</body>
</html>
