<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--bg:#F1F1F1;--ink:#0A0A0A;--mut:#6F6F73;--soft:#9A9AA0;--line:#DCDCDE;--card:#fff;--blue:#1D4ED8;
 --edge:radial-gradient(130% 95% at 50% 42%,rgba(0,0,0,0) 52%,rgba(150,175,200,.42) 100%);
 --gradcard:var(--edge),linear-gradient(180deg,#3a3b40 0%,#1d212b 12%,#0e1626 26%,#0b1730 40%,#13295a 54%,#1f4677 66%,#3f6d98 78%,#7c9bb7 90%,#aebdc8 100%);
 --gradfin:var(--edge),linear-gradient(180deg,#00163f 0%,#022657 18%,#103e6c 32%,#1d577e 44%,#2d698c 54%,#6092ad 66%,#aac8db 82%,#d4e4ee 100%)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;font-size:15px}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:10px}
.wrap{width:100%;max-width:1140px;margin:0 auto;padding:0 24px}
section{padding:96px 0}
h1,h2,h3{font-family:'Inter Tight',Inter,sans-serif;font-weight:500;letter-spacing:-.035em;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(40px,6vw,76px)}
h2{font-size:clamp(30px,4vw,50px)}
h3{font-size:22px;letter-spacing:-.02em;line-height:1.15}
.eyebrow{display:block;font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:14px}
.sub{color:var(--mut);font-size:17px;max-width:620px;line-height:1.6}
.center{text-align:center}.center .sub{margin-left:auto;margin-right:auto}
.btn{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 22px;border-radius:999px;font-weight:500;font-size:15px;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{box-shadow:0 10px 24px rgba(0,0,0,.18)}
.btn-light{background:#fff;color:var(--ink)}.btn-light:hover{box-shadow:0 8px 20px rgba(0,0,0,.08)}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* menú */
.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;width:calc(100% - 28px);max-width:780px;height:52px;background:rgba(12,12,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.logo{display:flex;align-items:center;gap:8px;white-space:nowrap;flex:none;font-family:'Inter Tight',Inter,sans-serif;font-weight:500;font-size:17px;letter-spacing:-.03em}
.logo svg{height:.95em;width:auto}
.nav-r{display:flex;align-items:center;gap:4px}
.nav-link{padding:8px 11px;border-radius:10px;font-size:13px;color:#c9c9cf;white-space:nowrap}.nav-link:hover{color:#fff}.nav-link[aria-current=page]{color:#fff}
.nav .btn{height:36px;padding:0 14px;font-size:13px;background:#fff;color:#0a0a0a}
.lang{display:flex;background:rgba(255,255,255,.08);border-radius:10px;padding:3px;margin-left:2px}
.lang button{padding:5px 8px;border-radius:8px;font-size:11px;font-weight:600;color:#a1a1aa}
.lang button[aria-pressed=true]{background:#fff;color:#0a0a0a}
/* portada */
.hero{padding:150px 0 40px;position:relative;overflow:hidden}
.hero .sub{margin-top:22px}
.hero .btns{margin-top:30px;justify-content:center}
.shield{width:84px;height:84px;margin:0 auto 26px;border-radius:24px;background:var(--gradcard);display:grid;place-items:center;color:#fff;box-shadow:0 20px 40px rgba(16,35,77,.25)}
.shield svg{width:38px;height:38px}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:34px}
.badges span{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;color:#3f3f46}
.badges span::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e}
/* pilares */
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:46px}
.pil{border-radius:26px;background:var(--gradcard);color:#fff;padding:24px 22px 26px;min-height:340px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.pil .no{font-size:13px;color:#b9c8e6}
.pil .ic{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;margin:22px 0 auto}
.pil .ic svg{width:26px;height:26px}
.pil h3{margin-top:28px}
.pil p{margin-top:10px;font-size:14px;line-height:1.55;color:#dbe4f3}
/* tablas */
.blk{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:start}
.blk + .blk{margin-top:96px}
.blk .sub{margin-top:16px;font-size:16px}
.tbl{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.tbl .row{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px;padding:16px 22px;border-top:1px solid #ececee;font-size:14.5px}
.tbl .row:first-child{border-top:0;background:#fafafa;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:12px 22px}
.tbl .row b{font-weight:600}
.tbl .row span{color:#3f3f46}
.tbl .row .ok{display:inline-flex;align-items:center;gap:7px;color:#15803d;font-weight:600}
.tbl .row .ok::before{content:"✓";display:grid;place-items:center;width:18px;height:18px;border-radius:6px;background:#dcfce7;font-size:11px}
/* preguntas */
.faqw{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px;align-items:start}
.qa{border-top:1px solid var(--line)}
.qa:last-child{border-bottom:1px solid var(--line)}
.qa button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;text-align:left;font-size:17px;font-weight:500}
.qa button i{font-style:normal;font-size:20px;color:var(--mut);transition:transform .25s}
.qa[open] button i{transform:rotate(45deg)}
.qa .a{display:none;padding:0 0 20px;color:var(--mut);font-size:15px;line-height:1.6;max-width:640px}
.qa[open] .a{display:block}
/* cierre */
.fin{border-radius:56px;background:var(--gradfin);color:#fff;text-align:center;padding:110px 24px 130px;margin:0 14px}
.fin h2{max-width:760px;margin:0 auto}
.fin p{color:#d6e2f2;margin:18px auto 0;max-width:560px;font-size:17px}
.fin .btns{justify-content:center;margin-top:30px}
.fin .btn-ghost{background:#0a0a0a;color:#fff}
footer{padding:70px 0 40px}
.fgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:28px}
.fgrid h4{font-size:13px;font-weight:600;margin-bottom:12px}
.fgrid a{display:block;color:var(--mut);font-size:14px;margin:6px 0}.fgrid a:hover{color:var(--ink)}
.fgrid .bl{font-size:20px;letter-spacing:-.02em;line-height:1.35;color:var(--mut);max-width:340px}.fgrid .bl b{color:var(--ink);font-weight:500}
.mark{display:flex;align-items:center;gap:18px;margin-top:64px;font-family:'Inter Tight',Inter,sans-serif;font-size:clamp(56px,9vw,120px);letter-spacing:-.06em;line-height:1}
.mark svg{height:.62em;width:auto}
.copy{margin-top:14px;color:#a1a1aa;font-size:12.5px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
@media (max-width:980px){.pillars{grid-template-columns:1fr 1fr}.blk,.faqw{grid-template-columns:1fr;gap:28px}.fgrid{grid-template-columns:1fr 1fr}.fgrid>div:first-child{grid-column:1/-1}}
@media (max-width:640px){
 section{padding:64px 0}.wrap{padding:0 18px}
 .nav{top:10px;width:calc(100% - 20px);height:48px;padding:0 6px 0 14px}
 .nav .hide-m{display:none}
 .hero{padding:110px 0 20px}
 .hero .btns{flex-direction:column;align-items:stretch}.hero .btn{justify-content:center}
 .pillars{grid-template-columns:1fr;gap:12px;margin-top:30px}
 .pil{min-height:0;border-radius:22px}.pil .ic{margin:18px 0 0}.pil h3{margin-top:20px}
 .blk + .blk{margin-top:64px}
 .tbl .row{grid-template-columns:1fr;gap:4px;padding:14px 18px}
 .tbl .row:first-child{display:none}
 .fin{border-radius:32px;margin:0 10px;padding:72px 20px 88px}
 .fin .btns{flex-direction:column;align-items:stretch}.fin .btn{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
/* precios */
.formula{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:stretch;max-width:980px;margin:46px auto 0}
.fx{border-radius:26px;background:var(--gradcard);color:#fff;padding:26px 26px 30px;display:flex;flex-direction:column}
.fx .no{font-size:13px;color:#b9c8e6}.fx .ic{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);display:grid;place-items:center;margin:22px 0 26px}.fx .ic svg{width:26px;height:26px}
.fx p{margin-top:10px;font-size:15px;line-height:1.6;color:#dbe4f3}
.plus{display:grid;place-items:center;font-family:'Inter Tight',Inter,sans-serif;font-size:44px;font-weight:300;color:var(--mut)}
.fnote{max-width:680px;margin:20px auto 0;text-align:center;color:var(--mut);font-size:14px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:46px;align-items:stretch}
.plan{background:#fff;border:1px solid var(--line);border-radius:26px;padding:26px;display:flex;flex-direction:column}
.plan .tag{align-self:flex-start;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:#f1f1f3;color:#3f3f46;margin-bottom:22px}
.plan h3{font-size:28px}.plan .who{display:block;margin-top:6px;font-size:14px;font-weight:500;color:var(--mut)}
.plan p{margin-top:16px;font-size:15px;line-height:1.6;color:#3f3f46}
.plan ul{list-style:none;margin:20px 0 26px;display:grid;gap:10px;font-size:14.5px}
.plan li{display:flex;gap:10px;align-items:flex-start}.plan li::before{content:"✓";flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:7px;background:#e0e7ff;color:#1d4ed8;font-size:11px;font-weight:700;margin-top:1px}
.plan .btn{margin-top:auto;justify-content:center}
.plan.hl{background:var(--gradcard);color:#fff;border-color:transparent}.plan.hl .tag{background:rgba(255,255,255,.14);color:#fff}.plan.hl .who{color:#b9c8e6}.plan.hl p{color:#dbe4f3}.plan.hl li::before{background:rgba(255,255,255,.16);color:#fff}
.tbl.inc .row{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}.tbl.inc .row:first-child{display:grid;background:none;font-size:14.5px;letter-spacing:0;text-transform:none;color:inherit;padding:16px 22px}
.tbl.inc .row b::before{content:"✓";display:inline-grid;place-items:center;width:18px;height:18px;border-radius:6px;background:#dcfce7;color:#15803d;font-size:11px;margin-right:9px;vertical-align:1px}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:46px}
.st{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px}
.st .n{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:#0a0a0a;color:#fff;font-weight:600;font-size:14px;margin-bottom:18px}
.st h3{font-size:19px}.st p{margin-top:8px;color:var(--mut);font-size:14px;line-height:1.55}
@media (max-width:980px){.formula{grid-template-columns:1fr}.plus{font-size:34px}.plans{grid-template-columns:1fr}.steps4{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.steps4{grid-template-columns:1fr}.fx,.plan{border-radius:22px;padding:22px}.tbl.inc .row:first-child{display:grid}}
</style>
</head>

var lang='es';try{var sv=localStorage.getItem('axai-lang');if(sv==='en'||sv==='es')lang=sv}catch(e){}
function t(k){return T[lang][k]}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function render(){
 document.documentElement.lang=lang;document.title=(lang==='en'?'Pricing':'Precios')+' · Ax AI';
 document.querySelectorAll('[data-i]').forEach(function(e){var v=t(e.dataset.i);if(typeof v==='string')e.textContent=v});
 document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});
 document.getElementById('badges').innerHTML=t('badges').map(function(b){return '<span>'+esc(b)+'</span>'}).join('');
 document.getElementById('icA').innerHTML=IC.store;document.getElementById('icB').innerHTML=IC.up;
 document.getElementById('plans').innerHTML=t('plans').map(function(p,i){return '<div class="plan'+(i===1?' hl':'')+'"><span class="tag">'+esc(p[4])+'</span><h3>'+esc(p[0])+'</h3><b class="who">'+esc(p[1])+'</b><p>'+esc(p[2])+'</p><ul>'+p[3].map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul><a class="btn '+(i===1?'btn-light':'btn-dark')+'" href="./#piloto">'+esc(t('pl.cta'))+' <span>→</span></a></div>'}).join('');
 document.getElementById('incl').innerHTML=t('incl').map(function(r){return '<div class="row"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>'}).join('');
 document.getElementById('steps4').innerHTML=t('steps').map(function(s,i){return '<div class="st"><span class="n">'+(i+1)+'</span><h3>'+esc(s[0])+'</h3><p>'+esc(s[1])+'</p></div>'}).join('');
 document.getElementById('faq').innerHTML=t('faq').map(function(q,i){return '<div class="qa"'+(i===0?' open':'')+'><button type="button" aria-expanded="'+(i===0)+'"><span>'+esc(q[0])+'</span><i aria-hidden="true">+</i></button><div class="a">'+esc(q[1])+'</div></div>'}).join('');
 document.querySelectorAll('.qa button').forEach(function(b){b.onclick=function(){var q=b.parentNode,o=!q.hasAttribute('open');if(o)q.setAttribute('open','');else q.removeAttribute('open');b.setAttribute('aria-expanded',String(o))}});
}
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){lang=b.dataset.lang;try{localStorage.setItem('axai-lang',lang)}catch(e){}render()}});
render();
var io='IntersectionObserver' in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12}):null;
document.querySelectorAll('.rv').forEach(function(e){if(io)io.observe(e);else e.classList.add('in')});
})();
