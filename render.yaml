services:
  - type: web
    name: ax-garantias
    runtime: docker
    plan: starter          # el disco persistente requiere un plan de pago
    healthCheckPath: /health
    disk:
      name: ax-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: AX_MODO_PRUEBA
        value: "1"         # quítalo (o pon 0) cuando uses asesores reales
