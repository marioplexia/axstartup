<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ax Ai Garantías</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<style>
/* Layout: sidebar negra fija + columna principal; el composer vive al centro (inicio) o abajo (chat) y se anima entre ambos. */
:root{
  --bg:#ffffff; --fg:#161616; --muted:#6f6e6b; --faint:#9a9894;
  --line:#e7e5e1; --surface:#f6f5f2; --card:#ffffff; --card-line:#e2e0dc;
  --send-off:#a3a19d; --send-on:#161616; --send-fg:#ffffff;
  --chip:#f4f3f0; --chip-hover:#eceae6; --menu:#ffffff; --hover:#f1f0ed;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 10px 28px -14px rgba(20,20,20,.16);
  --shadow-focus:0 1px 2px rgba(20,20,20,.05),0 14px 34px -14px rgba(20,20,20,.24);
  --sb-bg:#0a0a0a; --sb-fg:#ececea; --sb-muted:#8a8a87; --sb-active:#1f1f1f; --sb-hover:#151515; --sb-line:#1d1d1d;
  --f-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-display:'Newsreader',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --fg:#ededeb; --muted:#a09f9b; --faint:#77766f;
    --line:#272726; --surface:#1b1b1a; --card:#1f1f1e; --card-line:#30302e;
    --send-off:#474745; --send-on:#ededeb; --send-fg:#141414;
    --chip:#1d1d1c; --chip-hover:#282827; --menu:#1f1f1e; --hover:#242423;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    --shadow-focus:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.75);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141414; --fg:#ededeb; --muted:#a09f9b; --faint:#77766f;
  --line:#272726; --surface:#1b1b1a; --card:#1f1f1e; --card-line:#30302e;
  --send-off:#474745; --send-on:#ededeb; --send-fg:#141414;
  --chip:#1d1d1c; --chip-hover:#282827; --menu:#1f1f1e; --hover:#242423;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  --shadow-focus:0 1px 2px rgba(0,0,0,.3),0 14px 34px -14px rgba(0,0,0,.75);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}

.app{display:flex;height:100%;width:100%}

/* ---------- Sidebar ---------- */
.sb-wrap{flex:none;width:232px;overflow:hidden;background:var(--sb-bg);transition:width .34s cubic-bezier(.3,.8,.3,1)}
.app[data-sb="closed"] .sb-wrap{width:0}
.sb{width:232px;height:100%;display:flex;flex-direction:column;color:var(--sb-fg);padding-left:env(safe-area-inset-left,0px)}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 14px 16px}
.brand{font-size:22px;font-weight:500;letter-spacing:-.015em}
.sb-tools{display:flex;align-items:center;gap:4px}
.sb-ib{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#c9c9c6;transition:background .15s,color .15s}
.sb-ib:hover{background:var(--sb-active);color:#fff}
.sb-ib.dark{background:#262626;color:#e6e6e4;width:24px;height:24px}
.sb-ib.dark .ic{width:14px;height:14px}
.sb-scroll{flex:1;overflow-y:auto;padding:0 8px}
.grp{font-size:11.5px;color:var(--sb-muted);padding:0 12px;margin:14px 0 8px;letter-spacing:.01em}
.nav{display:flex;align-items:center;gap:12px;width:100%;height:33px;padding:0 12px;border-radius:8px;color:#d2d2cf;font-size:14px;transition:background .15s,color .15s}
.nav+.nav{margin-top:2px}
.nav:hover{background:var(--sb-hover);color:#fff}
.nav[aria-current="true"]{background:var(--sb-active);color:#fff}
.nav .ic{color:#bdbdba}
.sb-foot{border-top:1px solid var(--sb-line);padding:12px 8px calc(12px + env(safe-area-inset-bottom,0px))}
.avatar{width:24px;height:24px;border-radius:50%;background:#2a2a2a;display:grid;place-items:center;font-size:11px;font-weight:500;flex:none}
.sb-scrim{display:none}

/* ---------- Main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
.topbar{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--muted)}
.crumbs span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{color:var(--faint)}
.crumbs .cur{color:var(--fg);animation:fadein .35s both}
.tb-right{display:flex;align-items:center;gap:2px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--fg);transition:background .15s,transform .15s}
.ib:hover{background:var(--hover)}
.ib:active{transform:scale(.94)}
.ib.m{color:var(--muted)}
#sbOpen{margin-right:2px}
.app[data-sb="open"] #sbOpen{display:none}
.crumbs-wrap{display:flex;align-items:center;gap:4px;min-width:0}

.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.thread{flex:1;min-height:0;overflow-y:auto;padding-block:8px 24px;scroll-behavior:smooth}
.thread-in{width:100%;max-width:672px;margin:0 auto;display:flex;flex-direction:column;gap:26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock{width:100%;max-width:704px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:44px;position:relative}
.stage[data-state="chat"] .dock{margin:0 auto;padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
.stage[data-state="chat"] .dock::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:28px;background:linear-gradient(to top,var(--bg),transparent);pointer-events:none}
.stage[data-state="chat"] .hero-title,.stage[data-state="chat"] .chips{display:none}

.hero-title{font-family:var(--f-display);font-weight:500;font-size:clamp(28px,5.2vw,40px);line-height:1.1;letter-spacing:-.028em;text-align:center;margin:0 0 36px;text-wrap:balance}
.hero-title .w{display:inline-block;animation:wordin .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*75ms + 80ms)}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.rise.d1{animation-delay:.4s}.rise.d2{animation-delay:.55s}

/* Composer */
.composer{position:relative;z-index:3;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);transition:box-shadow .25s}
.composer:focus-within{box-shadow:var(--shadow-focus)}
.composer.drag .card{border-color:var(--fg);border-style:dashed}
.c-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px 7px 12px;min-height:41px}
.dd{display:inline-flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:7px;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.dd:hover,.dd[aria-expanded="true"]{background:var(--chip-hover);color:var(--fg)}
.dd .chev{width:13px;height:13px;transition:transform .2s}
.dd[aria-expanded="true"] .chev{transform:rotate(180deg)}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:12px 12px 14px 14px;transition:border-color .2s}
.composer:focus-within .card{border-color:color-mix(in srgb,var(--fg) 28%,var(--card-line))}
.files{display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px 0}
.file{display:inline-flex;align-items:center;gap:7px;max-width:210px;background:var(--surface);border-radius:8px;padding:4px 6px 4px 8px;font-size:12.5px;animation:pop .22s cubic-bezier(.2,.9,.3,1.2) both}
.file img{width:20px;height:20px;border-radius:4px;object-fit:cover}
.file b{font-weight:450;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file button{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--muted)}
.file button:hover{background:var(--chip-hover);color:var(--fg)}
.file .ic{width:13px;height:13px}
#ta{display:block;width:100%;min-height:78px;max-height:220px;resize:none;border:0;outline:0;background:transparent;padding:18px 20px 4px;font-size:15px;line-height:1.55}
#ta::placeholder{color:var(--faint)}
.stage[data-state="chat"] #ta{min-height:46px;padding-top:14px}
.c-foot{display:flex;align-items:center;gap:2px;padding:6px 10px 10px 12px}
.c-foot .sp{flex:1}
.fb{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .15s}
.fb:hover{background:var(--hover);color:var(--fg)}
.fb:active{transform:scale(.92)}
.fb.rec{color:#d8483b;animation:recpulse 1s ease-in-out 2}
.send{width:32px;height:32px;border-radius:9px;margin-left:6px;display:grid;place-items:center;background:var(--send-off);color:var(--send-fg);transition:background .2s,transform .2s cubic-bezier(.2,.9,.3,1.3)}
.send.on{background:var(--send-on);cursor:pointer}
.send.on:hover{transform:scale(1.06)}
.send:active{transform:scale(.93)}
.send:not(.on){cursor:default}

.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:18px;position:relative;z-index:2}
.chip{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 13px;border-radius:9px;background:var(--chip);font-size:12.5px;transition:background .15s,transform .15s}
.chip:hover,.chip[aria-expanded="true"]{background:var(--chip-hover)}
.chip:active{transform:scale(.97)}
.chip .ic{width:15px;height:15px}

/* Menus */
.menu-host{position:relative;display:inline-flex}
.menu{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;max-width:min(320px,calc(100vw - 32px));background:var(--menu);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 44px -14px rgba(0,0,0,.28),0 2px 6px rgba(0,0,0,.06);padding:5px;z-index:60;transform-origin:top left;animation:menuin .17s cubic-bezier(.2,.9,.3,1) both}
.menu.up{top:auto;bottom:calc(100% + 6px);transform-origin:bottom left}
.menu.right{left:auto;right:0;transform-origin:top right}
.menu.up.right{transform-origin:bottom right}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--fg);transition:background .12s}
.mi:hover,.mi:focus-visible{background:var(--hover)}
.mi .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.mi .tx b{font-weight:450;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .tx small{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .ic{color:var(--muted)}
.mi .tick{color:var(--fg)}
.mh{padding:6px 10px 4px;font-size:11px;color:var(--faint);letter-spacing:.02em}

/* Messages */
.msg-user{align-self:flex-end;max-width:86%;display:flex;flex-direction:column;align-items:flex-end;gap:8px;animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.msg-user .bubble{background:var(--surface);padding:10px 16px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55}
.msg-user .files{padding:0;justify-content:flex-end}
.msg-ai{display:flex;gap:14px;animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
.ai-mark{width:26px;height:26px;border-radius:8px;background:var(--fg);color:var(--bg);font-size:10.5px;font-weight:600;letter-spacing:-.02em;display:grid;place-items:center;flex:none;margin-top:1px}
.ai-col{min-width:0;flex:1}
.ai-body{font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.ai-body p{margin:0 0 14px}
.ai-body p:last-child,.ai-body ol:last-child,.ai-body blockquote:last-child{margin-bottom:0}
.ai-body ol{margin:0 0 14px;padding-left:22px}
.ai-body li{margin-bottom:6px;padding-left:2px}
.ai-body blockquote{margin:0 0 14px;padding:2px 0 2px 14px;border-left:2px solid var(--card-line);color:var(--muted)}
.ai-body strong{font-weight:600}
.ai-body .muted{color:var(--muted)}
.caret{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--fg);margin-left:4px;vertical-align:-1px;animation:caret 1s ease-in-out infinite}
.thinking{display:inline-flex;align-items:center;gap:2px;font-size:14px;background:linear-gradient(90deg,var(--muted) 30%,var(--fg) 50%,var(--muted) 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.6s linear infinite}
.dots{display:inline-flex;margin-left:3px}
.dots i{font-style:normal;animation:dot 1.2s infinite both}
.dots i::before{content:"."}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.ai-actions{display:flex;gap:2px;margin-top:10px;margin-left:-6px;animation:fadein .4s both}
.ai-actions .fb{width:28px;height:28px;color:var(--faint)}
.ai-actions .fb.act{color:var(--fg)}

/* Pantalla del agente (simulación de portal) */
.cu-wrap{margin:16px 0 4px;display:flex;flex-direction:column;gap:14px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.cu{border:1px solid var(--card-line);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
.cu-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.cu-dots{display:flex;gap:5px;flex:none}
.cu-dots i{width:9px;height:9px;border-radius:50%;background:var(--card-line)}
.cu-url{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:6px;background:var(--card);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.cu-url span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cu-url .ic{width:12px;height:12px}
.cu-tag{font-size:10.5px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--chip-hover);color:var(--muted);letter-spacing:.02em;flex:none}
.cu-vp{--pbg:#f3f5f9;--pcard:#ffffff;--pfg:#1b2430;--pmut:#667286;--pline:#dde2ea;--pacc:#2f5bd9;--pok:#1f8a4c;--pwarn:#b7791f;
  position:relative;height:320px;background:var(--pbg);color:var(--pfg);overflow:hidden;container-type:inline-size;font-size:12px;line-height:1.4;pointer-events:none;user-select:none}
.cu-cursor{position:absolute;left:0;top:0;z-index:6;width:22px;height:22px;transition:transform .75s cubic-bezier(.45,.05,.2,1),opacity .4s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.cu-cursor svg{width:22px;height:22px;display:block;transform-origin:3px 2px;transition:transform .12s}
.cu-cursor.click svg{transform:scale(.8)}
.cu-demo{position:absolute;right:10px;bottom:6px;z-index:3;font-size:10px;color:var(--pmut)}
.cu-st{display:flex;align-items:center;gap:9px;padding:9px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.cu-st .pulse{width:8px;height:8px;border-radius:50%;background:#2fa866;flex:none;animation:caret 1.1s ease-in-out infinite}
.cu.done .pulse,.cu.stopped .pulse{animation:none}
.cu.stopped .pulse{background:var(--faint)}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.steps li{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;padding:4px 2px;font-size:13.5px;color:var(--faint);transition:color .25s}
.steps li[data-s="active"],.steps li[data-s="done"],.steps li[data-s="warn"]{color:var(--fg)}
.steps .mk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--card-line);display:grid;place-items:center;margin-top:2px;transition:background .25s,border-color .25s}
.steps .mk svg{width:10px;height:10px;display:none;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.steps li[data-s="active"] .mk{border-color:var(--fg);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li[data-s="done"] .mk{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.steps li[data-s="done"] .mk .k{display:block}
.steps li[data-s="warn"] .mk{background:#c58a1a;border-color:#c58a1a;color:#fff}
.steps li[data-s="warn"] .mk .w{display:block}
.steps .det{display:block;color:var(--muted);font-size:12.5px}
.steps .det:empty{display:none}

.pg{position:absolute;inset:0;opacity:0;transition:opacity .3s;overflow:hidden;background:var(--pbg)}
.pg.on{opacity:1}
.ph{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--pcard);border-bottom:1px solid var(--pline);font-weight:500}
.ph em{margin-left:auto;font-style:normal;color:var(--pmut);font-weight:400}
.logo{width:20px;height:20px;border-radius:5px;background:var(--pacc);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;flex:none}
.bd{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.bd h4,.lg h4{margin:0;font-size:13.5px;font-weight:600}
.center{display:grid;place-items:center}
.lg{width:min(270px,88%);display:flex;flex-direction:column;gap:9px;background:var(--pcard);border:1px solid var(--pline);border-radius:10px;padding:16px}
.lgh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.lgh .logo{width:28px;height:28px;font-size:12px;border-radius:7px}
.lgh small{color:var(--pmut);font-size:11px}
.fl{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl>span{font-size:10px;color:var(--pmut);text-transform:uppercase;letter-spacing:.05em}
.inp{height:28px;padding:0 9px;border:1px solid var(--pline);border-radius:6px;background:var(--pcard);display:flex;align-items:center;font-size:12px;white-space:nowrap;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.inp.tall{display:block;height:auto;min-height:52px;white-space:normal;padding:7px 9px;line-height:1.45}
.inp.focus{border-color:var(--pacc);box-shadow:0 0 0 3px rgba(47,91,217,.16)}
.focus::after{content:"";display:inline-block;width:1px;height:13px;background:currentColor;margin-left:1px;vertical-align:-2px;animation:blink 1s steps(2) infinite}
.pb{height:28px;padding:0 14px;border-radius:6px;background:var(--pacc);color:#fff;font-size:12px;font-weight:500;align-self:flex-end;transition:transform .12s,filter .12s;border:0;white-space:nowrap}
.pb.press,.rw.press{transform:scale(.96);filter:brightness(.92)}
.pb.sm{height:22px;padding:0 9px;font-size:11px;background:transparent;color:var(--pacc);border:1px solid var(--pline);align-self:flex-start}
.row{display:flex;gap:8px;align-items:flex-end}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.veh{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;padding:10px 12px;border:1px solid var(--pline);border-radius:8px;background:var(--pcard);animation:rise .4s both}
.veh span{display:block;font-size:10px;color:var(--pmut);text-transform:uppercase;letter-spacing:.05em}
.veh b{font-weight:500;font-size:12px}
.veh .okc{color:var(--pok)}
.res{display:flex;flex-direction:column;gap:5px;animation:rise .35s both}
.rw{display:flex;gap:10px;align-items:center;padding:6px 10px;border:1px solid var(--pline);border-radius:6px;background:var(--pcard);font-size:11.5px;transition:background .15s,border-color .15s,transform .12s}
.rw b{font-weight:600;flex:none;width:76px}

/* ---------- Markdown mínimo ---------- */
function inl(s){
  s=esc(s);
  if((s.match(/\*\*/g)||[]).length%2){var i=s.lastIndexOf('**');s=s.slice(0,i)+s.slice(i+2)}
  return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
}
function md(src,caret){
  var blocks=src.replace(/\s+$/,'').split(/\n{2,}/).filter(Boolean),ch=caret?'<span class="caret"></span>':'';
  return blocks.map(function(b,i){
    var last=i===blocks.length-1,c=last?ch:'',ls=b.split('\n');
    if(ls.every(function(l){return /^>\s?/.test(l)}))return '<blockquote>'+inl(ls.map(function(l){return l.replace(/^>\s?/,'')}).join(' '))+c+'</blockquote>';
    if(ls.every(function(l){return /^\d+\.(\s|$)/.test(l)}))return '<ol>'+ls.map(function(l,j){return '<li>'+inl(l.replace(/^\d+\.\s?/,''))+(last&&j===ls.length-1?c:'')+'</li>'}).join('')+'</ol>';
    return '<p>'+inl(ls.join(' '))+c+'</p>';
  }).join('');
}

async function nap(ms,my){var end=Date.now()+ms;while(Date.now()<end&&!my.aborted)await sleep(Math.min(40,Math.max(1,end-Date.now())))}

function makeSim(card,my){
  var vp=$('.cu-vp',card),cur=$('.cu-cursor',card),stx=$('.cu-txt',card),url=$('.cu-url span',card),lis=$$('.steps li',card);
  function w(ms){return nap(ms,my).then(function(){if(my.aborted)throw ABORT})}
  function say(t){stx.textContent=t}
  function step(i,s,d){var li=lis[i];li.dataset.s=s;if(d!=null)$('.det',li).textContent=d}
  function pos(el,mode){var a=vp.getBoundingClientRect(),b=el.getBoundingClientRect();var fx=mode==='c'?.5:Math.min(.3,70/Math.max(b.width,1));return [b.left-a.left+b.width*fx,b.top-a.top+b.height*.6]}
  async function mv(el,mode){var p=pos(el,mode);cur.style.transform='translate('+p[0]+'px,'+p[1]+'px)';await w(780)}
  async function ck(el){cur.classList.add('click');el.classList.add('press');await w(170);cur.classList.remove('click');el.classList.remove('press');await w(160)}
  async function ty(el,text,ms){await mv(el);el.classList.add('focus');el.textContent='';for(var i=1;i<=text.length;i++){el.textContent=text.slice(0,i);await w(ms||28)}await w(200);el.classList.remove('focus')}
  async function go(html,u){
    var old=$('.pg.on',vp),t=document.createElement('div');t.innerHTML=html;var p=t.firstElementChild;
    vp.insertBefore(p,cur);void p.offsetWidth;p.classList.add('on');
    if(old){old.classList.remove('on');setTimeout(function(){old.remove()},360)}
    url.textContent='portal-garantias.ejemplo'+u;await w(380);return p;
  }
  function K(p,k){return $('[data-k="'+k+'"]',p)}

  return {vp:vp,cur:cur,w:w,say:say,step:step,mv:mv,ck:ck,ty:ty,go:go,K:K};
}
async function simulate(card,ctx,my){
  var H=makeSim(card,my),vp=H.vp,cur=H.cur,w=H.w,say=H.say,step=H.step,mv=H.mv,ck=H.ck,ty=H.ty,go=H.go,K=H.K;
  cur.style.transform='translate('+(vp.clientWidth-70)+'px,'+(vp.clientHeight-50)+'px)';
  await w(500);

  /* 1. Acceso */
  step(0,'active');say('Abriendo el portal del fabricante…');
  var p=await go(PG.login(),'/acceso'),b;
  await ty(K(p,'u'),'asesor.demo');
  await ty(K(p,'p'),'••••••••',36);
  b=K(p,'go');await mv(b,'c');await ck(b);say('Iniciando sesión…');await w(1000);
  step(0,'done','Sesión iniciada como asesor.demo');

  /* 2. Vehículo */
  step(1,'active');say('Buscando el vehículo por VIN…');
  p=await go(PG.veh(ctx),'/prea/nueva');
  await ty(K(p,'vin'),ctx.vin);
  b=K(p,'find');await mv(b,'c');await ck(b);say('Consultando el vehículo…');await w(900);
  K(p,'veh').hidden=false;say('Verificando la cobertura…');await w(900);
  step(1,'done',ctx.vehicle+' · cobertura vigente');

  /* 3. Reclamación */
  step(2,'active');say('Capturando los datos de la reclamación…');
  p=await go(PG.claim(),'/prea/nueva/reclamacion');
  await ty(K(p,'d'),ctx.date);
  await ty(K(p,'km'),ctx.kmTxt+' km');
  await ty(K(p,'t'),'Garantía básica');
  await ty(K(p,'sys'),ctx.sys);
  say('Pasando la queja del cliente…');
  await ty(K(p,'q'),ctx.queja,13);
  step(2,'done',ctx.kmTxt+' km · '+ctx.sys);

  /* 4. Operación y mano de obra */
  step(3,'active');say('Buscando el código de operación…');
  p=await go(PG.labor(ctx),'/prea/nueva/mano-de-obra');
  await ty(K(p,'s'),ctx.opd.split(' ').slice(0,3).join(' ').toLowerCase());
  K(p,'res').hidden=false;await w(800);
  var pk=K(p,'pick');say('Eligiendo la operación que coincide con la queja…');
  await mv(pk);await ck(pk);pk.classList.add('sel');
  say('Leyendo el tiempo estándar de mano de obra…');K(p,'opd').hidden=false;await w(900);
  say('Capturando el tiempo de mano de obra…');
  await ty(K(p,'hc'),ctx.hBad.toFixed(1)+' h');
  step(3,'done',ctx.op+' · tiempo estándar '+ctx.h.toFixed(1)+' h');

  /* 5. Piezas */
  step(4,'active');say('Agregando las piezas…');
  p=await go(PG.parts(),'/prea/nueva/piezas');
  var rows=K(p,'rows'),add=K(p,'add'),tot=K(p,'tot'),acc=0;
  for(var i=0;i<ctx.parts.length;i++){
    var pt=ctx.parts[i];
    await mv(add,'c');await ck(add);
    var tr=document.createElement('tr');tr.className='new';
    tr.innerHTML='<td></td><td>'+esc(pt.d)+'</td><td>'+pt.q+'</td><td>'+money(pt.q*pt.pr)+'</td>';
    rows.appendChild(tr);
    await ty(tr.firstChild,pt.no,22);
    acc+=pt.q*pt.pr;tot.innerHTML='Subtotal piezas <b>'+money(acc)+'</b>';
    say('Pieza '+(i+1)+' de '+ctx.parts.length+' agregada…');await w(300);
  }
  step(4,'done',ctx.parts.length+(ctx.parts.length===1?' partida · ':' partidas · ')+money(ctx.partsTot));

  /* 6. Validación */
  step(5,'active');say('Validando la PREA contra las reglas del fabricante…');
  p=await go(PG.check(),'/prea/nueva/validacion');
  var list=K(p,'list'),nf=ctx.files.length;
  var checks=[
    ['Cobertura vigente por fecha y kilometraje',ctx.kmTxt+' km de 60,000'],
    ['Queja coherente con la operación',ctx.op],
    ['Tiempo de mano de obra contra el estándar',null],
    ['Piezas compatibles con el VIN',ctx.parts.length+(ctx.parts.length===1?' partida':' partidas')],
    ['Evidencia adjunta',nf?nf+(nf===1?' archivo':' archivos'):'Descripción del caso'],
    ['Sin PREA duplicada para este VIN','Sin coincidencias']
  ],fixes=0;
  for(var j=0;j<checks.length;j++){
    var ci=document.createElement('div');ci.className='ci';
    ci.innerHTML='<span class="s sp"></span><span>'+checks[j][0]+'</span><small></small>';
    list.appendChild(ci);var dot=$('.s',ci),sm=$('small',ci);
    say('Validando: '+checks[j][0].toLowerCase()+'…');await w(750+Math.random()*350);
    if(checks[j][1]===null){
      dot.className='s wn';sm.textContent='Capturado '+ctx.hBad.toFixed(1)+' h, estándar '+ctx.h.toFixed(1)+' h';
      step(5,'warn','El tiempo de mano de obra supera el estándar');
      say('El tiempo capturado supera el estándar. Lo corrijo…');await w(900);
      var fb=document.createElement('button');fb.className='pb sm';fb.tabIndex=-1;fb.textContent='Ajustar';ci.insertBefore(fb,sm);
      await mv(fb,'c');await ck(fb);fb.remove();
      dot.className='s ok';sm.textContent='Ajustado a '+ctx.h.toFixed(1)+' h';fixes++;
      step(5,'active','');await w(500);
    }else{dot.className='s ok';sm.textContent=checks[j][1]}
  }
  step(5,'done','6 de 6 reglas aprobadas · '+fixes+' corrección');

  /* 7. Envío */
  step(6,'active');say('Preparando el envío…');
  p=await go(PG.send(ctx),'/prea/nueva/resumen');
  await w(700);
  b=K(p,'submit');await mv(b,'c');await ck(b);b.textContent='Enviando…';say('Subiendo la PREA al portal…');await w(1700);
  var ov=document.createElement('div');ov.innerHTML=PG.ok(ctx);vp.insertBefore(ov.firstElementChild,cur);
  cur.style.opacity='0';await w(700);
  step(6,'done','Folio '+ctx.folio+' · en revisión');
  say('PREA enviada. Quedó en revisión.');card.firstElementChild.classList.add('done');
}

async function stream(el,text,my){
  var tokens=text.match(/\S+\s*|\s+/g)||[],acc='';
  for(var k=0;k<tokens.length;k++){
    if(my.aborted)break;
    acc+=tokens[k];el.innerHTML=md(acc,true);toBottom();
    await nap(14+Math.random()*26+(/[.:?]\s*$/.test(tokens[k])?60:0),my);
  }
  el.innerHTML=md(acc,false);return acc;
}
var THINK='<span class="thinking">Analizando el caso<span class="dots"><i></i><i></i><i></i></span></span>';
function stopCard(card){var cu=$('.cu',card);cu.classList.add('stopped');$('.cu-txt',card).textContent='Detenido. No se envió nada.';$$('.steps li[data-s="active"]',card).forEach(function(li){li.dataset.s='pending'})}
function finish(my){if(S.ctrl===my){S.streaming=false;S.ctrl=null;updateSend()}toBottom()}
function hideRegen(w){var b=$('[data-act="regen"]',w);if(b)b.hidden=true}
async function agentTurn(w,ctx,intro,steps,sim,fin,my){
  var col=$('.ai-col',w),body=$('.ai-body',w),acts=$('.ai-actions',w);
  body.innerHTML=THINK;toBottom();await nap(800+Math.random()*400,my);
  var full='';
  if(!my.aborted){
    full=await stream(body,intro,my);
    if(!my.aborted){
      var card=buildCard(ctx,steps);col.insertBefore(card,acts);
      try{card.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(_){}
      try{await sim(card,ctx,my)}catch(e){if(e!==ABORT)console.error(e)}
      if(my.aborted){stopCard(card)}
      else{var b2=document.createElement('div');b2.className='ai-body fin';col.insertBefore(b2,acts);S.stick=true;full+='\n\n'+await stream(b2,fin,my)}
    }
  }
  if(!full)body.innerHTML='<p class="muted">Respuesta detenida.</p>';
  w._text=full.replace(/\*\*/g,'').replace(/^> /gm,'');
  if(w.isConnected)acts.hidden=false;
  return !my.aborted;
}
async function run(text,files){

}

function r2(n){return Math.round(n*100)/100}
function cobrosCtx(text,files,brand){
  var c=ctxFrom(text,files,brand),m=(text||'').match(/PREA-DEMO-\d{6}/i);
  c.prea=m?m[0].toUpperCase():c.folio;
  c.rateP=480;c.laborP=r2(c.h*c.rateP);
  c.pp=c.parts.map(function(p){var u=Math.round(p.pr*0.92);return {no:p.no,d:p.d,q:p.q,unit:u,claim:p.q*p.pr,pay:p.q*u}});
  c.partsPTot=c.pp.reduce(function(a,p){return a+p.pay},0);
  c.claimTot=r2(c.partsTot+c.labor);c.sub=r2(c.laborP+c.partsPTot);c.iva=r2(c.sub*0.16);c.total=r2(c.sub+c.iva);c.diff=r2(c.claimTot-c.sub);
  c.uuid='DEMO-'+Math.random().toString(16).slice(2,10).toUpperCase();
  c.factura='FAC-DEMO-'+String(Math.floor(1000+Math.random()*9000));
  c.fname='Factura-'+c.prea+'.pdf';
  c.pago='PAGO-DEMO-'+String(Math.floor(100000+Math.random()*900000));
  return c;
}

  step(1,'done',ctx.op+' y '+ctx.pp.length+(ctx.pp.length===1?' pieza':' piezas')+' · reclamado '+money(ctx.claimTot));

  step(2,'active');say('Consultando los precios vigentes de planta…');
  p=await go(PG.catalog(ctx),'/catalogo/precios');rows=K(p,'rows');
  for(var k=0;k<ctx.pp.length;k++){
    var r=ctx.pp[k];say('Precio vigente de planta: '+r.d.toLowerCase()+'…');
    await addRow(rows,'<td>'+r.no+' · '+esc(r.d)+' ×'+r.q+'</td><td>'+money(r.claim)+'</td><td>'+money(r.pay)+'</td><td class="hs adj">−'+money(r.claim-r.pay)+'</td>');
  }
  step(2,'done',money(ctx.partsPTot)+' a precio vigente de planta');

  step(3,'active');say('Validando la mano de obra…');
  p=await go(PG.laborG(ctx),'/mano-de-obra/validacion');
  var list=K(p,'list'),items=[
    ['Código de operación vigente',ctx.op],
    ['Tiempo estándar de la operación',ctx.h.toFixed(1)+' h'],
    ['Tiempo de la PREA contra el estándar','Coincide · '+ctx.h.toFixed(1)+' h'],
    ['Tarifa de mano de obra de planta',money(ctx.rateP)+' por hora'],
    ['Importe de mano de obra',money(ctx.laborP)]
  ];
  for(var j=0;j<items.length;j++){
    var ci=document.createElement('div');ci.className='ci';
    ci.innerHTML='<span class="s sp"></span><span>'+items[j][0]+'</span><small></small>';list.appendChild(ci);
    await mv(ci);say('Validando: '+items[j][0].toLowerCase()+'…');await w(700);
    $('.s',ci).className='s ok';$('small',ci).textContent=items[j][1];
  }
  await w(400);
  step(3,'done',ctx.h.toFixed(1)+' h × '+money(ctx.rateP)+' = '+money(ctx.laborP));

  step(4,'active');say('Simulando lo que planta va a pagar…');
  p=await go(PG.bill(ctx),'/simulacion/pago');
  for(var n=1;n<=5;n++){var ln=K(p,'l'+n);ln.hidden=false;await mv(ln);await w(650)}
  K(p,'co').hidden=false;await w(900);
  cur.style.opacity='0';
  step(4,'done','Facturar '+money(ctx.sub)+' más IVA');
  say('Planta pagará '+money(ctx.sub)+' antes de IVA.');card.firstElementChild.classList.add('done');
}

async function simCobros2(card,ctx,my){
  var H=makeSim(card,my),vp=H.vp,cur=H.cur,w=H.w,say=H.say,step=H.step,mv=H.mv,ck=H.ck,ty=H.ty,go=H.go,K=H.K;
  cur.style.transform='translate('+(vp.clientWidth-70)+'px,'+(vp.clientHeight-50)+'px)';
  await w(500);
  step(0,'active');say('Abriendo el portal del fabricante…');
  var p=await go(PG.login(),'/acceso'),b;
  K(p,'u').textContent='asesor.demo';K(p,'p').textContent='••••••••';await w(400);
  b=K(p,'go');await mv(b,'c');await ck(b);say('Iniciando sesión…');await w(800);
  step(0,'done','Sesión iniciada');

  step(1,'active');say('Comparando la factura con la simulación previa…');
  p=await go(PG.invChk(ctx),'/facturas/revision');
  await runChecks(K(p,'list'),[
    ['Folio fiscal (UUID) válido',ctx.uuid],
    ['Receptor es planta','Coincide'],
    ['Subtotal coincide con la simulación',money(ctx.sub)],
    ['IVA 16% correcto',money(ctx.iva)],
    ['Total coincide con la simulación',money(ctx.total)]
  ],w,say);
  step(1,'done','Subtotal '+money(ctx.sub)+' · coincide con la simulación');

  step(2,'active');say('Subiendo la factura a la PREA…');
  p=await go(PG.up(ctx),'/prea/'+ctx.prea.toLowerCase()+'/factura');
  b=K(p,'up');await mv(b,'c');await ck(b);say('Cargando '+ctx.fname+'…');await w(800);
  K(p,'drop').hidden=true;K(p,'file').hidden=false;await w(700);
  say('Planta recibió la factura…');K(p,'st').hidden=false;await w(900);
  step(2,'done',ctx.factura+' recibida por planta');

  step(3,'active');say('Preparando la transacción con planta…');
  p=await go(PG.pay(ctx),'/prea/'+ctx.prea.toLowerCase()+'/pago');await w(800);
  b=K(p,'submit');await mv(b,'c');await ck(b);b.textContent='Procesando…';
  K(p,'sum').hidden=true;K(p,'prog').hidden=false;
  await runChecks(K(p,'prog'),[
    ['Factura validada por planta','Aceptada','Planta está validando la factura…'],
    ['Importe autorizado',money(ctx.total),'Planta autoriza el importe…'],
    ['Pago generado','A favor de la agencia','Generando el pago…']
  ],w,say);
  step(3,'done','Transacción autorizada por planta');

  step(4,'active');say('Confirmando el pago…');await w(900);
  var ov=document.createElement('div');ov.innerHTML=PG.okPay(ctx);vp.insertBefore(ov.firstElementChild,cur);
  cur.style.opacity='0';await w(800);
  step(4,'done',money(ctx.total)+' · ref. '+ctx.pago);
  say('Pago registrado por '+money(ctx.total)+'.');card.firstElementChild.classList.add('done');
}

async function runCobros(text,files){
  var my={aborted:false};S.ctrl=my;S.streaming=true;S.last={text:text,files:files};updateSend();
  var ctx=cobrosCtx(text,files,S.brand),w1=addAssistant();hideRegen(w1);
  var ok=await agentTurn(w1,ctx,introC1(ctx),stepsC1(ctx),simCobros1,finalC1(ctx),my);
  if(ok){
    await nap(2600,my);
    if(!my.aborted){
      addUser('Ya subí la factura por el importe que me diste: '+money(ctx.total)+'.',[{name:ctx.fname,img:null}]);
      await nap(900,my);
      if(!my.aborted){var w2=addAssistant();hideRegen(w2);await agentTurn(w2,ctx,introC2(ctx),STEPS_C2,simCobros2,finalC2(ctx),my)}
    }
  }
  finish(my);
}
function start(text,files){return S.agent==='cobros'?runCobros(text,files):run(text,files)}

function onSend(){
  if(S.streaming){if(S.ctrl)S.ctrl.aborted=true;return}
  var text=ta.value.trim(),files=S.files.slice();
  if(!text&&!files.length)return;
  closeMenu();showView(curView());
  enterChat(text||files[0].name);
  addUser(text,files);
  typeTok++;ta.value='';S.files=[];renderFiles();autosize();updateSend();
  start(text,files);
}
async function loadHistory(h){
  showView(curView());resetChat();
  enterChat(h.t);addUser(h.q,[]);
  var txt;
  if(S.agent==='cobros'){var cc=cobrosCtx(h.q,[],'General Motors');txt=introC1(cc)+'\n\n'+finalC1(cc)}
  else{var ctx=ctxFrom(h.q,[],'General Motors');txt=introText(ctx)+'\n\n'+finalText(ctx)}
  var w=addAssistant();$('.ai-body',w).innerHTML=md(txt,false);
  w._text=txt.replace(/\*\*/g,'');hideRegen(w);
  $('.ai-actions',w).hidden=false;S.last={text:h.q,files:[]};toBottom(true);
}

/* ---------- Buscar (Ctrl/Cmd+K) ---------- */
function openSearch(){
  if($('.scrim'))return;closeMenu();
  var sc=document.createElement('div');sc.className='scrim';
  sc.innerHTML='<div class="palette" role="dialog" aria-label="Buscar"><input id="q" placeholder="Ir a…" autocomplete="off" aria-label="Buscar sección"><div class="pl" id="pl"></div></div>';
  document.body.appendChild(sc);
  var q=$('#q',sc),pl=$('#pl',sc),sel=0,cur=[];
  function paint(){
    var v=q.value.trim().toLowerCase();
    cur=Object.keys(VIEWS).filter(function(k){return k!=='inicio'&&VIEWS[k].toLowerCase().indexOf(v)>-1});
    if(sel>=cur.length)sel=0;pl.innerHTML='';
    if(!cur.length){pl.innerHTML='<div class="empty">Sin resultados</div>';return}
    cur.forEach(function(k,i){var b=item(pl,{icon:{agent:'file',chat:'chat',bitacora:'clip',exp:'folderopen',cobros:'dollar',cartera:'wallet',pres:'present'}[k],t:VIEWS[k],fn:function(){close();showView(k)}});b.dataset.sel=String(i===sel)});
  }
  function close(){sc.remove()}
  sc.addEventListener('mousedown',function(e){if(e.target===sc)close()});
  q.addEventListener('input',function(){sel=0;paint()});
  q.addEventListener('keydown',function(e){
    if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,cur.length-1);paint()}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);paint()}
    else if(e.key==='Enter'&&cur[sel]){close();showView(cur[sel])}
  });
  paint();q.focus();
}
$('#searchBtn').addEventListener('click',openSearch);
document.addEventListener('keydown',function(e){
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}
  else if(e.key==='Escape'){closeMenu();var s=$('.scrim');if(s)s.remove()}
});

updateSend();
setTimeout(function(){try{if(!mq.matches)ta.focus({preventScroll:true})}catch(_){}},900);
})();
